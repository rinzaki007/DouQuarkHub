name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

# 授予读写权限
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 使用 repository_owner_lower 强制转换为小写，避免大小写导致的权限拒绝
          tags: ghcr.io/${{ github.repository_owner_lower }}/mycloudcore:latest
