<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieSync - 影视智搜与转存系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen flex flex-col">

    <!-- 顶栏：左侧分类/功能，中间搜索框，右侧系统状态与设置 -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-40 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            
            <!-- 左侧：分类与功能入口 -->
            <div class="flex items-center space-x-2 shrink-0">
                <button onclick="changeTag('电影')" class="nav-tag px-3.5 py-1.5 rounded text-sm font-medium transition bg-blue-600 text-white shadow-md" data-tag="电影">电影</button>
                <button onclick="changeTag('电视剧')" class="nav-tag px-3.5 py-1.5 rounded text-sm font-medium transition bg-slate-800/80 text-slate-300 hover:bg-slate-700" data-tag="电视剧">电视剧</button>
                <button onclick="changeTag('综艺')" class="nav-tag px-3.5 py-1.5 rounded text-sm font-medium transition bg-slate-800/80 text-slate-300 hover:bg-slate-700" data-tag="综艺">综艺</button>
                <button onclick="changeTag('动漫')" class="nav-tag px-3.5 py-1.5 rounded text-sm font-medium transition bg-slate-800/80 text-slate-300 hover:bg-slate-700" data-tag="动漫">动漫</button>
                
                <button onclick="openChaseModal()" class="px-2.5 py-1.5 rounded text-xs font-medium bg-purple-600 hover:bg-purple-500 text-white transition flex items-center gap-1 shadow">
                    <i class="fa-solid fa-heart"></i> 智能追剧管理
                </button>
                <a href="/openlist" target="_blank" class="px-2.5 py-1.5 rounded text-xs font-medium bg-emerald-600 hover:bg-emerald-500 text-white transition flex items-center gap-1 shadow">
                    <i class="fa-solid fa-folder-open"></i> OpenList
                </a>
                <a href="https://pan.quark.cn" target="_blank" class="px-2.5 py-1.5 rounded text-xs font-medium bg-amber-600 hover:bg-amber-500 text-white transition flex items-center gap-1 shadow">
                    <i class="fa-solid fa-cloud"></i> 夸克端
                </a>
            </div>

            <!-- 中间：搜索框 -->
            <div class="flex-1 max-w-md mx-4 relative">
                <input type="text" id="search-input" placeholder="搜索豆瓣影视资源..." 
                       class="w-full bg-slate-950/80 border border-slate-700/80 rounded-lg px-3.5 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 shadow-inner"
                       onkeydown="if(event.key==='Enter') doSearch()">
                <button onclick="doSearch()" class="absolute right-3 top-2 text-slate-400 hover:text-white text-xs">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <!-- 右侧：Cookie状态、频道检测、运行日志、设置 -->
            <div class="flex items-center space-x-2 shrink-0">
                <div id="cookie-status-badge" class="px-2 py-1 text-xs rounded bg-slate-800/80 text-slate-400 border border-slate-700/80 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-slate-500 animate-pulse"></span>
                    <span>检测中</span>
                </div>
                <div id="channel-status-badge" class="px-2 py-1 text-xs rounded bg-slate-800/80 text-slate-400 border border-slate-700/80 flex items-center gap-1">
                    <i class="fa-brands fa-telegram text-sky-400"></i>
                    <span id="channel-count-text">频道 --/--</span>
                </div>
                <button onclick="toggleLogBox()" class="px-2.5 py-1.5 text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded border border-slate-700/50 flex items-center gap-1">
                    <i class="fa-solid fa-terminal"></i> 运行日志
                </button>
                <a href="/admin" class="px-2.5 py-1.5 text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded border border-slate-700/50 flex items-center gap-1">
                    <i class="fa-solid fa-gear"></i> 设置
                </a>
            </div>
        </div>
    </header>

    <!-- 第二行：排序方式与超宽资源选择显示栏 -->
    <div class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-2.5 sticky top-[57px] z-30 shadow-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            
            <!-- 左侧：排序方式 + 已选统计 + 影片名称预览区 -->
            <div class="flex items-center space-x-4 flex-1 overflow-hidden">
                <div class="flex items-center space-x-2 shrink-0">
                    <span class="text-xs text-slate-400 font-medium">排序方式：</span>
                    <div class="inline-flex bg-slate-950/80 p-0.5 rounded-lg border border-slate-800 text-xs gap-1">
                        <button onclick="changeSort('U')" class="sort-tag px-3 py-1 rounded-md font-medium transition bg-blue-600 text-white shadow" data-sort="U">
                            <i class="fa-solid fa-fire mr-1 text-amber-300"></i> 热门推荐
                        </button>
                        <button onclick="changeSort('R')" class="sort-tag px-3 py-1 rounded-md font-medium transition text-slate-400 hover:text-white" data-sort="R">
                            <i class="fa-solid fa-clock mr-1 text-sky-300"></i> 最近最新
                        </button>
                    </div>
                </div>

                <div class="h-4 w-px bg-slate-800 shrink-0"></div>

                <div class="flex items-center space-x-3 flex-1 overflow-hidden">
                    <div class="flex items-center space-x-1.5 shrink-0">
                        <span class="text-xs text-slate-400">已选 <b id="selected-count" class="text-blue-400">0</b> 部</span>
                        <button onclick="selectAll(true)" class="px-2 py-1 text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded">全选</button>
                        <button onclick="selectAll(false)" class="px-2 py-1 text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded">取消</button>
                    </div>
                    
                    <!-- 资源名称预览显示区 -->
                    <div id="selected-titles-preview" class="flex items-center gap-1.5 overflow-hidden text-xs flex-1"></div>
                </div>
            </div>

            <!-- 右侧：转存资源按钮 -->
            <div class="shrink-0">
                <button onclick="batchTransfer()" class="px-4 py-2 text-xs bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-medium flex items-center gap-1.5 shadow-lg shadow-emerald-600/20 transition">
                    <i class="fa-solid fa-cloud-arrow-down text-sm"></i> 转存资源
                </button>
            </div>

        </div>
    </div>

    <!-- 主展示网格 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4">
        <div id="loading" class="text-center py-20 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-blue-500"></i>
            <p class="text-sm">正在获取豆瓣数据...</p>
        </div>
        <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 hidden"></div>
    </main>

    <!-- 引用弹窗与日志组件 -->
    {% include 'components/chase_modal.html' %}
    {% include 'components/transfer_modal.html' %}
    {% include 'components/log_panel.html' %}

    <!-- 引入细分后的三个独立 JS 脚本 -->
    <script src="{{ url_for('static', filename='js/transfer.js') }}"></script>
    <script src="{{ url_for('static', filename='js/subscription.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
