<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieSync - 影视智搜与转存系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
        }
        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        #log-box {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background-color: #020617;
            font-size: 13px;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 顶部导航与主操作栏 -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            
            <div class="flex items-center space-x-2 shrink-0">
                <button onclick="changeTag('电影')" class="nav-tag px-3 py-1.5 rounded text-sm font-medium transition bg-blue-600 text-white" data-tag="电影">电影</button>
                <button onclick="changeTag('电视剧')" class="nav-tag px-3 py-1.5 rounded text-sm font-medium transition bg-slate-800 text-slate-300 hover:bg-slate-700" data-tag="电视剧">电视剧</button>
                <button onclick="changeTag('综艺')" class="nav-tag px-3 py-1.5 rounded text-sm font-medium transition bg-slate-800 text-slate-300 hover:bg-slate-700" data-tag="综艺">综艺</button>
                <button onclick="changeTag('动漫')" class="nav-tag px-3 py-1.5 rounded text-sm font-medium transition bg-slate-800 text-slate-300 hover:bg-slate-700" data-tag="动漫">动漫</button>
                
                <button onclick="openChaseModal()" class="px-2.5 py-1.5 rounded text-xs font-medium bg-purple-600 hover:bg-purple-500 text-white transition flex items-center gap-1">
                    <i class="fa-solid fa-heart"></i> 智能追剧管理
                </button>
                <a href="/openlist" target="_blank" class="px-2.5 py-1.5 rounded text-xs font-medium bg-emerald-600 hover:bg-emerald-500 text-white transition flex items-center gap-1">
                    <i class="fa-solid fa-folder-open"></i> OpenList
                </a>
                <a href="https://pan.quark.cn" target="_blank" class="px-2.5 py-1.5 rounded text-xs font-medium bg-amber-600 hover:bg-amber-500 text-white transition flex items-center gap-1">
                    <i class="fa-solid fa-cloud"></i> 夸克端
                </a>
            </div>

            <!-- 搜索框 -->
            <div class="flex-1 min-w-[220px] max-w-md mx-2 relative">
                <input type="text" id="search-input" placeholder="搜索豆瓣影视资源..." 
                       class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500"
                       onkeydown="if(event.key==='Enter') doSearch()">
                <button onclick="doSearch()" class="absolute right-2 top-1.5 text-slate-400 hover:text-white">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <!-- 右侧状态看板与操作 -->
            <div class="flex items-center space-x-2 shrink-0">
                <div id="cookie-status-badge" class="px-2 py-1 text-xs rounded bg-slate-800 text-slate-400 border border-slate-700 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-slate-500 animate-pulse"></span>
                    <span>检测中</span>
                </div>
                <div id="channel-status-badge" class="px-2 py-1 text-xs rounded bg-slate-800 text-slate-400 border border-slate-700 flex items-center gap-1">
                    <i class="fa-brands fa-telegram text-sky-400"></i>
                    <span id="channel-count-text">频道 --/--</span>
                </div>

                <span class="text-xs text-slate-400">已选 <b id="selected-count" class="text-blue-400">0</b> 部</span>
                <button onclick="selectAll(true)" class="px-2 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">全选</button>
                <button onclick="selectAll(false)" class="px-2 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">取消</button>
                <button onclick="batchTransfer()" class="px-2.5 py-1.5 text-xs bg-emerald-600 hover:bg-emerald-500 text-white rounded font-medium flex items-center gap-1">
                    <i class="fa-solid fa-cloud-arrow-down"></i> 转存资源
                </button>
                <button onclick="toggleLogBox()" class="px-2.5 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded flex items-center gap-1">
                    <i class="fa-solid fa-terminal"></i> 运行日志
                </button>
                <a href="/admin" class="px-2.5 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded flex items-center gap-1">
                    <i class="fa-solid fa-gear"></i> 设置
                </a>
            </div>
        </div>
    </header>

    <!-- 多维细分筛选栏 -->
    <div class="bg-slate-900/60 border-b border-slate-800/80 px-4 py-2.5 space-y-2 text-xs">
        <div class="max-w-7xl mx-auto flex flex-col space-y-2">
            <div class="flex items-center space-x-3 overflow-x-auto">
                <span class="text-slate-400 font-medium shrink-0">排序:</span>
                <button onclick="changeSort('U')" class="sort-tag text-blue-400 font-medium shrink-0" data-sort="U">热门</button>
                <button onclick="changeSort('R')" class="sort-tag text-slate-400 hover:text-white shrink-0" data-sort="R">最新</button>
                <button onclick="changeSort('S')" class="sort-tag text-slate-400 hover:text-white shrink-0" data-sort="S">高分</button>
            </div>
            <div class="flex items-center space-x-3 overflow-x-auto">
                <span class="text-slate-400 font-medium shrink-0">类型:</span>
                <div id="genre-list" class="flex items-center space-x-2 shrink-0"></div>
            </div>
            <div class="flex items-center space-x-3 overflow-x-auto">
                <span class="text-slate-400 font-medium shrink-0">地区:</span>
                <div id="region-list" class="flex items-center space-x-2 shrink-0"></div>
            </div>
            <div class="flex items-center space-x-3 overflow-x-auto">
                <span class="text-slate-400 font-medium shrink-0">年代:</span>
                <div id="year-list" class="flex items-center space-x-2 shrink-0"></div>
            </div>
        </div>
    </div>

    <!-- 主展示网格 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4">
        <div id="loading" class="text-center py-20 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-blue-500"></i>
            <p class="text-sm">正在获取豆瓣数据...</p>
        </div>
        <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 hidden"></div>
    </main>

    <!-- 🚀 智能追剧管理弹窗（max-w-5xl 宽屏优化） -->
    <div id="chase-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-lg w-full max-w-5xl p-6 shadow-2xl space-y-4 max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center gap-3">
                    <h3 class="text-base font-semibold text-white flex items-center gap-2">
                        <i class="fa-solid fa-heart text-purple-500"></i> 智能自动化追剧管理中心
                    </h3>
                    <div class="flex bg-slate-950 p-0.5 rounded border border-slate-800 text-xs">
                        <button onclick="switchChaseTab('add')" id="chase-tab-add" class="px-3.5 py-1.5 rounded bg-purple-600 text-white font-medium transition">添加新追剧</button>
                        <button onclick="switchChaseTab('list')" id="chase-tab-list" class="px-3.5 py-1.5 rounded text-slate-400 hover:text-white transition">已订阅任务 (<span id="sub-count-badge">0</span>)</button>
                    </div>
                </div>
                <button onclick="closeChaseModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <!-- Tab 1: 添加追剧向导 -->
            <div id="chase-panel-add" class="flex-1 overflow-y-auto space-y-4 pr-1">
                <div class="bg-slate-950 border border-slate-800 rounded p-4 space-y-3">
                    <div class="text-xs font-semibold text-purple-400">第一步：填写剧名并检索全网频道</div>
                    <div class="flex gap-2">
                        <input type="text" id="chase-title-input" placeholder="例如: 绝命毒师" class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-purple-500">
                        <button onclick="searchChaseCandidates()" class="px-5 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded text-xs font-medium transition shadow">
                            🔍 检索频道资源
                        </button>
                    </div>
                </div>

                <div id="chase-candidates-container" class="space-y-3 hidden">
                    <div class="text-xs font-semibold text-blue-400">第二步：选择要监控的 TG 频道及具体集数白名单</div>
                    <div id="chase-candidates-list" class="space-y-3"></div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-slate-950 border border-slate-800 rounded p-4 space-y-2">
                        <div class="text-xs font-semibold text-amber-400">第三步：选择存储父目录 FID (系统将在此目录下自动创建剧名专属文件夹)</div>
                        <input type="text" id="chase-target-fid" value="fe24e17d8d254997b21710c73b22b6e7" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                    </div>
                    <div class="bg-slate-950 border border-slate-800 rounded p-4 space-y-2">
                        <div class="text-xs font-semibold text-emerald-400">第四步：设定自动检测更新频率</div>
                        <select id="chase-interval-select" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-xs text-slate-200 focus:outline-none">
                            <option value="3">每 3 小时检测一次</option>
                            <option value="6" selected>每 6 小时检测一次</option>
                            <option value="9">每 9 小时检测一次</option>
                            <option value="12">每 12 小时检测一次</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Tab 2: 已订阅任务列表管理 -->
            <div id="chase-panel-list" class="flex-1 overflow-y-auto space-y-3 pr-1 hidden">
                <div class="bg-slate-950 border border-slate-800 rounded-lg overflow-hidden">
                    <table class="w-full text-left text-xs text-slate-300">
                        <thead class="bg-slate-900 text-slate-400 uppercase font-semibold border-b border-slate-800">
                            <tr>
                                <th class="px-3.5 py-3">剧集名称</th>
                                <th class="px-3.5 py-3">监控频道</th>
                                <th class="px-3.5 py-3">频率</th>
                                <th class="px-3.5 py-3">状态/上次检测</th>
                                <th class="px-3.5 py-3 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="modal-sub-table-body" class="divide-y divide-slate-800/80">
                            <tr><td colspan="5" class="px-3 py-6 text-center text-slate-500">正在加载...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="flex justify-between items-center pt-3 border-t border-slate-800">
                <button onclick="closeChaseModal()" class="px-4 py-2 text-xs bg-slate-800 text-slate-300 rounded hover:bg-slate-700">关闭</button>
                <button id="btn-submit-chase" onclick="submitSmartChase()" class="px-5 py-2 text-xs bg-purple-600 text-white rounded hover:bg-purple-500 font-medium hidden shadow">
                    🚀 保存并开启自动化追剧
                </button>
            </div>
        </div>
    </div>

    <!-- 🎬 交互式候选资源选择弹窗 -->
    <div id="candidate-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-lg w-full max-w-2xl p-5 shadow-2xl space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-base font-medium text-white flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-blue-500"></i> 选择要转存的资源版本
                </h3>
                <button onclick="closeCandidateModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <div id="candidate-content" class="flex-1 overflow-y-auto space-y-4 pr-1"></div>
            <div class="flex justify-end pt-2 border-t border-slate-800">
                <button onclick="closeCandidateModal()" class="px-4 py-1.5 text-xs bg-slate-800 text-slate-300 rounded hover:bg-slate-700">关闭</button>
            </div>
        </div>
    </div>

    <!-- 底部固定实时日志面板 (仅在手动批量转存时弹出，追剧管理不再干扰) -->
    <div id="log-panel" class="fixed bottom-0 left-0 right-0 z-50 bg-slate-950 border-t border-slate-800 shadow-2xl transition-all duration-300 hidden">
        <div class="flex items-center justify-between px-4 py-2 bg-slate-900 border-b border-slate-800">
            <div class="flex items-center gap-2 text-xs text-slate-300 font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                实时转存运行日志
            </div>
            <div class="flex items-center gap-2">
                <button onclick="clearLog()" class="px-2 py-0.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">清空</button>
                <button onclick="toggleLogBox(false)" class="px-2 py-0.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">收起 ×</button>
            </div>
        </div>
        <div id="log-box" class="h-48 overflow-y-auto p-3"></div>
    </div>

    <script>
        let currentTag = '电影';
        let currentSort = 'U';
        let currentGenre = '全部';
        let currentRegion = '全部';
        let currentYear = '全部';

        const genres = ['全部', '剧情', '喜剧', '动作', '爱情', '科幻', '动画', '悬疑', '惊悚', '犯罪', '奇幻', '冒险'];
        const regions = ['全部', '中国大陆', '中国香港', '中国台湾', '美国', '日本', '韩国', '英国', '法国'];
        const years = ['全部', '2026', '2025', '2024', '2023', '2022', '2021', '2020'];

        let moviesData = [];
        let selectedIndices = new Set();
        let currentChaseSelectedCandidate = null;

        document.addEventListener("DOMContentLoaded", () => {
            initFilterOptions();
            fetchMovies();
            checkSystemHealth();
        });

        async function checkSystemHealth() {
            try {
                const respConfig = await fetch('/api/config');
                const resConfig = await respConfig.json();
                if (resConfig.success && resConfig.config) {
                    const tvFid = resConfig.config.category_fids?.['电视剧'] || resConfig.config.default_fid || '0';
                    document.getElementById('chase-target-fid').value = tvFid;
                }

                const localCookie = localStorage.getItem('quark_cookie') || '';
                const resp = await fetch('/api/check-cookie', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cookie: localCookie })
                });
                const res = await resp.json();
                const badge = document.getElementById('cookie-status-badge');
                if (res.valid) {
                    badge.className = "px-2 py-1 text-xs rounded bg-emerald-950/80 text-emerald-400 border border-emerald-800 flex items-center gap-1";
                    badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>Cookie 有效</span>`;
                } else {
                    badge.className = "px-2 py-1 text-xs rounded bg-rose-950/80 text-rose-400 border border-rose-800 flex items-center gap-1";
                    badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span><span>Cookie 失效</span>`;
                }
            } catch (err) {
                console.error("初始化检测异常", err);
            }

            try {
                const resp = await fetch('/api/check-channels');
                const res = await resp.json();
                if (res.success) {
                    document.getElementById('channel-count-text').innerText = `频道 ${res.valid_count}/${res.total}`;
                }
            } catch (err) {
                console.error("频道检测异常", err);
            }
        }

        function initFilterOptions() {
            renderFilterRow('genre-list', genres, currentGenre, (val) => { currentGenre = val; fetchMovies(); });
            renderFilterRow('region-list', regions, currentRegion, (val) => { currentRegion = val; fetchMovies(); });
            renderFilterRow('year-list', years, currentYear, (val) => { currentYear = val; fetchMovies(); });
        }

        function renderFilterRow(containerId, items, activeVal, onClick) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            items.forEach(item => {
                const btn = document.createElement('button');
                btn.className = item === activeVal ? 'text-blue-400 font-medium' : 'text-slate-400 hover:text-white';
                btn.innerText = item;
                btn.onclick = () => {
                    renderFilterRow(containerId, items, item, onClick);
                    onClick(item);
                };
                container.appendChild(btn);
            });
        }

        function changeTag(tag) {
            currentTag = tag;
            document.querySelectorAll('.nav-tag').forEach(btn => {
                btn.className = btn.dataset.tag === tag 
                    ? 'nav-tag px-3 py-1.5 rounded text-sm font-medium transition bg-blue-600 text-white'
                    : 'nav-tag px-3 py-1.5 rounded text-sm font-medium transition bg-slate-800 text-slate-300 hover:bg-slate-700';
            });
            fetchMovies();
        }

        function changeSort(sort) {
            currentSort = sort;
            document.querySelectorAll('.sort-tag').forEach(btn => {
                btn.className = btn.dataset.sort === sort ? 'sort-tag text-blue-400 font-medium shrink-0' : 'sort-tag text-slate-400 hover:text-white shrink-0';
            });
            fetchMovies();
        }

        async function fetchMovies() {
            const loading = document.getElementById('loading');
            const grid = document.getElementById('movie-grid');
            loading.classList.remove('hidden');
            grid.classList.add('hidden');
            selectedIndices.clear();
            updateSelectedCount();

            try {
                const url = `/api/get-movies?tag=${encodeURIComponent(currentTag)}&sort=${currentSort}&genre=${encodeURIComponent(currentGenre)}&region=${encodeURIComponent(currentRegion)}&year=${encodeURIComponent(currentYear)}`;
                const resp = await fetch(url);
                const res = await resp.json();
                if (res.success) {
                    moviesData = res.movies || [];
                    renderGrid();
                }
            } catch (err) {
                console.error(err);
            } finally {
                loading.classList.add('hidden');
                grid.classList.remove('hidden');
            }
        }

        async function doSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            const loading = document.getElementById('loading');
            const grid = document.getElementById('movie-grid');
            loading.classList.remove('hidden');
            grid.classList.add('hidden');
            selectedIndices.clear();
            updateSelectedCount();

            try {
                const resp = await fetch(`/api/search-douban?q=${encodeURIComponent(query)}`);
                const res = await resp.json();
                if (res.success) {
                    moviesData = res.movies || [];
                    renderGrid();
                }
            } catch (err) {
                console.error(err);
            } finally {
                loading.classList.add('hidden');
                grid.classList.remove('hidden');
            }
        }

        function renderGrid() {
            const grid = document.getElementById('movie-grid');
            grid.innerHTML = '';

            moviesData.forEach((movie, idx) => {
                const coverUrl = movie.cover ? `/api/proxy-img?url=${encodeURIComponent(movie.cover)}` : 'https://via.placeholder.com/150x220?text=No+Cover';
                const isSelected = selectedIndices.has(idx);

                const card = document.createElement('div');
                card.className = `relative group bg-slate-900 border ${isSelected ? 'border-blue-500' : 'border-slate-800'} rounded-lg overflow-hidden card-shadow cursor-pointer transition`;
                card.onclick = (e) => {
                    if (e.target.tagName !== 'A') {
                        toggleSelect(idx);
                    }
                };

                card.innerHTML = `
                    <div class="aspect-[2/3] w-full bg-slate-950 relative overflow-hidden">
                        <img src="${coverUrl}" alt="${movie.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                        <div class="absolute top-2 left-2 z-10">
                            <input type="checkbox" ${isSelected ? 'checked' : ''} class="w-4 h-4 rounded border-slate-600 bg-slate-900/80 text-blue-600 focus:ring-0">
                        </div>
                        <div class="absolute top-2 right-2 bg-slate-900/90 backdrop-blur text-amber-400 text-[11px] font-bold px-1.5 py-0.5 rounded border border-slate-700/50">
                            ${movie.rate || '暂无'}
                        </div>
                    </div>
                    <div class="p-2.5">
                        <div class="font-medium text-xs text-slate-200 line-clamp-1 group-hover:text-blue-400 transition" title="${movie.title}">${movie.title}</div>
                        <div class="mt-1 flex items-center justify-between text-[11px]">
                            <a href="${movie.url}" target="_blank" class="text-blue-400 hover:underline">详情</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleSelect(idx) {
            if (selectedIndices.has(idx)) selectedIndices.delete(idx);
            else selectedIndices.add(idx);
            updateSelectedCount();
            renderGrid();
        }

        function selectAll(select) {
            if (select) moviesData.forEach((_, idx) => selectedIndices.add(idx));
            else selectedIndices.clear();
            updateSelectedCount();
            renderGrid();
        }

        function updateSelectedCount() {
            document.getElementById('selected-count').innerText = selectedIndices.size;
        }

        function toggleLogBox(show = true) {
            const panel = document.getElementById('log-panel');
            if (show) panel.classList.remove('hidden');
            else panel.classList.toggle('hidden');
        }

        function clearLog() {
            document.getElementById('log-box').innerHTML = '';
        }

        function appendLogLine(text, type = 'info') {
            const logBox = document.getElementById('log-box');
            if (!text) return;
            const lines = text.split('\n');
            lines.forEach(line => {
                if (line.trim().length > 0) {
                    const div = document.createElement('div');
                    let colorClass = 'text-sky-400';
                    if (type === 'success') colorClass = 'text-emerald-400 font-semibold';
                    else if (type === 'warn') colorClass = 'text-amber-400';
                    else if (type === 'error') colorClass = 'text-rose-400 font-bold';

                    div.className = `py-0.5 font-mono leading-relaxed ${colorClass} border-b border-slate-900/40`;
                    div.textContent = line;
                    logBox.appendChild(div);
                }
            });
            logBox.scrollTop = logBox.scrollHeight;
        }

        // ==========================================
        // 🚀 智能追剧管理中心逻辑
        // ==========================================
        function openChaseModal() { 
            // 打开弹窗时保持底部的批量日志框关闭状态
            document.getElementById('chase-modal').classList.remove('hidden');
            switchChaseTab('add');
            loadModalSubscriptions();
        }

        function closeChaseModal() { 
            document.getElementById('chase-modal').classList.add('hidden'); 
        }

        function switchChaseTab(tabName) {
            const tabAdd = document.getElementById('chase-tab-add');
            const tabList = document.getElementById('chase-tab-list');
            const panelAdd = document.getElementById('chase-panel-add');
            const panelList = document.getElementById('chase-panel-list');
            const submitBtn = document.getElementById('btn-submit-chase');

            if (tabName === 'add') {
                tabAdd.className = "px-3.5 py-1.5 rounded bg-purple-600 text-white font-medium transition";
                tabList.className = "px-3.5 py-1.5 rounded text-slate-400 hover:text-white transition";
                panelAdd.classList.remove('hidden');
                panelList.classList.add('hidden');
                if(currentChaseSelectedCandidate) submitBtn.classList.remove('hidden');
            } else {
                tabList.className = "px-3.5 py-1.5 rounded bg-purple-600 text-white font-medium transition";
                tabAdd.className = "px-3.5 py-1.5 rounded text-slate-400 hover:text-white transition";
                panelList.classList.remove('hidden');
                panelAdd.classList.add('hidden');
                submitBtn.classList.add('hidden');
                loadModalSubscriptions();
            }
        }

        async function loadModalSubscriptions() {
            const tbody = document.getElementById('modal-sub-table-body');
            tbody.innerHTML = '<tr><td colspan="5" class="px-3.5 py-6 text-center text-slate-500"><i class="fa-solid fa-spinner fa-spin"></i> 正在加载...</td></tr>';
            try {
                const resp = await fetch('/api/subscriptions');
                const res = await resp.json();
                if (res.success && res.subscriptions) {
                    document.getElementById('sub-count-badge').innerText = res.subscriptions.length;
                    if (res.subscriptions.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="px-3.5 py-8 text-center text-slate-500">暂无自动化追剧任务，请先去【添加新追剧】创建。</td></tr>';
                        return;
                    }
                    tbody.innerHTML = '';
                    res.subscriptions.forEach(sub => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-slate-900/60";
                        tr.innerHTML = `
                            <td class="px-3.5 py-3 font-medium text-slate-200">${sub.title}</td>
                            <td class="px-3.5 py-3 text-emerald-400">${sub.channel || '默认频道'}</td>
                            <td class="px-3.5 py-3 text-slate-400">${sub.interval_hours} 小时</td>
                            <td class="px-3.5 py-3 text-slate-400">${sub.last_check || '等待触发'}</td>
                            <td class="px-3.5 py-3 text-right space-x-2">
                                <button onclick="runSubNow('${sub.id}')" class="bg-purple-600 hover:bg-purple-500 text-white px-2.5 py-1 rounded text-[11px]">立即运行</button>
                                <button onclick="deleteSub('${sub.id}')" class="bg-rose-900/60 hover:bg-rose-800 text-rose-200 px-2.5 py-1 rounded text-[11px]">删除</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="5" class="px-3.5 py-4 text-center text-rose-400">加载失败</td></tr>';
            }
        }

        async function runSubNow(subId) {
            try {
                const resp = await fetch('/api/subscriptions/run-now', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: subId })
                });
                const res = await resp.json();
                alert(res.message || '已执行检视');
                loadModalSubscriptions(); // 仅刷新列表，不弹出底部的批量转存日志框
            } catch (err) {
                alert('手动执行失败');
            }
        }

        async function deleteSub(subId) {
            if (!confirm('确定要删除该追剧任务吗？')) return;
            try {
                await fetch(`/api/subscriptions?id=${subId}`, { method: 'DELETE' });
                loadModalSubscriptions();
            } catch (err) {
                alert('删除失败');
            }
        }

        async function searchChaseCandidates() {
            const title = document.getElementById('chase-title-input').value.trim();
            if (!title) return alert('请输入要追剧的名称');

            const cookie = localStorage.getItem('quark_cookie') || '';
            const listContainer = document.getElementById('chase-candidates-list');
            listContainer.innerHTML = `<div class="text-xs text-slate-400 py-6 text-center"><i class="fa-solid fa-spinner fa-spin"></i> 正在全网并发检索频道...</div>`;
            document.getElementById('chase-candidates-container').classList.remove('hidden');

            try {
                const resp = await fetch('/api/search-candidates', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        movies: [{ title: title, tag: '电视剧' }],
                        cookie: cookie
                    })
                });
                const res = await resp.json();
                if (!res.success) {
                    listContainer.innerHTML = `<div class="text-xs text-rose-400 py-2">检索失败: ${res.message}</div>`;
                    return;
                }

                const candidatesMap = res.candidates_map || {};
                const candidates = candidatesMap[title] || [];

                if (candidates.length === 0) {
                    listContainer.innerHTML = `<div class="text-xs text-amber-400 py-4 text-center">未在任何配置频道中找到匹配资源，请检查片名是否正确。</div>`;
                    return;
                }

                listContainer.innerHTML = '';
                candidates.forEach((cand) => {
                    const fileNames = cand.files.map((f) => `
                        <label class="flex items-center gap-2 py-1 text-xs text-slate-300 hover:text-white cursor-pointer">
                            <input type="checkbox" name="chase-file-item" value="${f.fid}" checked class="chase-file-cb rounded bg-slate-900 border-slate-700 text-purple-600">
                            <span class="font-mono">${f.file_name}</span>
                        </label>
                    `).join('');

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'bg-slate-950 border border-slate-800 rounded-lg p-4 space-y-3';
                    itemDiv.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-emerald-400"><i class="fa-brands fa-telegram"></i> 频道: ${cand.channel}</span>
                            <button onclick='selectThisChaseCandidate(${JSON.stringify(cand)}, this)' class="px-3.5 py-1.5 bg-purple-600 hover:bg-purple-500 text-white rounded text-xs font-medium transition">
                                👈 锁定此源并追剧
                            </button>
                        </div>
                        <div class="text-xs text-slate-400">夸克短码: <span class="font-mono text-slate-200">${cand.pwd_id}</span> | 包含视频数: ${cand.files.length}</div>
                        <div class="bg-slate-900 p-3 rounded-md max-h-48 overflow-y-auto space-y-1 border border-slate-800">
                            <div class="text-[11px] text-slate-400 mb-2 font-medium">勾选您需要监控/下载的具体集数或版本（不勾选的集数将自动跳过）：</div>
                            ${fileNames}
                        </div>
                    `;
                    listContainer.appendChild(itemDiv);
                });

            } catch (err) {
                listContainer.innerHTML = `<div class="text-xs text-rose-400 py-2">请求发生异常: ${err.message}</div>`;
            }
        }

        function selectThisChaseCandidate(candidate, btnElement) {
            currentChaseSelectedCandidate = candidate;
            document.querySelectorAll('#chase-candidates-list button').forEach(btn => {
                btn.className = "px-3.5 py-1.5 bg-purple-600 hover:bg-purple-500 text-white rounded text-xs font-medium transition";
                btn.innerText = "👈 锁定此源并追剧";
            });
            btnElement.className = "px-3.5 py-1.5 bg-emerald-600 text-white rounded text-xs font-medium";
            btnElement.innerText = "✅ 已锁定此源";
            
            document.getElementById('btn-submit-chase').classList.remove('hidden');
            alert(`已成功锁定频道 [${candidate.channel}] 的分享源！请在下方设置存储目录和频率并点击保存。`);
        }

        async function submitSmartChase() {
            const title = document.getElementById('chase-title-input').value.trim();
            const intervalHours = parseInt(document.getElementById('chase-interval-select').value) || 6;
            const targetFid = document.getElementById('chase-target-fid').value.trim() || '0';

            if (!title || !currentChaseSelectedCandidate) {
                return alert('请先输入名称并锁定一个有效的频道分享源！');
            }

            const checkboxes = document.querySelectorAll('input[name="chase-file-item"]:checked');
            const selectedFids = Array.from(checkboxes).map(cb => cb.value);

            if (selectedFids.length === 0) {
                return alert('请至少勾选一个需要监控的文件/集数！');
            }

            const filteredFiles = currentChaseSelectedCandidate.files.filter(f => selectedFids.includes(f.fid));
            const payload = {
                title: title,
                channel: currentChaseSelectedCandidate.channel,
                pwd_id: currentChaseSelectedCandidate.pwd_id,
                stoken: currentChaseSelectedCandidate.stoken,
                files: filteredFiles,
                interval_hours: intervalHours,
                target_fid: targetFid
            };

            try {
                const resp = await fetch('/api/subscriptions', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const res = await resp.json();
                alert(res.message || '自动化追剧规则保存成功！');
                switchChaseTab('list');
            } catch (err) {
                alert('保存追剧任务失败');
            }
        }

        async function batchTransfer() {
            if (selectedIndices.size === 0) return alert('请先选择至少一部影片');

            const cookie = localStorage.getItem('quark_cookie') || '';
            const selectedMovies = Array.from(selectedIndices).map(idx => {
                const item = moviesData[idx];
                return {
                    title: item.title,
                    tag: currentTag || '电影',
                    cover: item.cover,
                    url: item.url
                };
            });
            
            toggleLogBox(true);
            clearLog();
            appendLogLine(`[任务发起] 🚀 准备开始并发搜刮，共选中 ${selectedMovies.length} 部目标影片...`, 'info');
            selectedMovies.forEach(m => appendLogLine(`  -> 目标: 《${m.title}》 (${m.tag})`, 'info'));
            
            try {
                const response = await fetch('/api/search-candidates', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        movies: selectedMovies,
                        cookie: cookie
                    })
                });

                const res = await response.json();
                if (!res.success) {
                    appendLogLine(`[系统错误] ❌ 搜刮失败: ${res.message || '未知错误'}`, 'error');
                    return;
                }

                appendLogLine(`[并发搜刮] ✅ 后端多线程检索已顺利完成！`, 'success');

                const candidatesMap = res.candidates_map || {};
                let totalFound = 0;

                for (const movie of selectedMovies) {
                    const title = movie.title;
                    const candidates = candidatesMap[title] || [];
                    totalFound += candidates.length;

                    if (candidates.length === 0) {
                        appendLogLine(`[结果统计] ⚠️ 《${title}》：未在任何配置频道中检索到有效候选资源。`, 'warn');
                    } else {
                        appendLogLine(`[结果统计] 🎯 《${title}》：成功检索到 ${candidates.length} 个可用版本。`, 'success');
                        candidates.forEach((cand, idx) => {
                            appendLogLine(`    [${idx + 1}] 频道名称: "${cand.channel}" | 夸克短码: ${cand.pwd_id} | 包含视频: ${cand.files.length} 个`, 'info');
                        });
                    }
                }

                appendLogLine(`[系统完成] 📦 全网检索汇总完毕：共找到 ${totalFound} 个候选资源，正在为您弹出交互选择窗口...`, 'success');
                openCandidateModal(selectedMovies, candidatesMap);
            } catch (err) {
                appendLogLine(`[异常捕获] ❌ 请求过程发生异常: ${err.message}`, 'error');
            }
        }

        function openCandidateModal(movies, candidatesMap) {
            toggleLogBox(false);

            const container = document.getElementById('candidate-content');
            container.innerHTML = '';
            
            movies.forEach(movie => {
                const title = movie.title;
                const candidates = candidatesMap[title] || [];

                const movieSection = document.createElement('div');
                movieSection.className = 'bg-slate-950 border border-slate-800 rounded p-3 space-y-2';
                
                let html = `<div class="font-medium text-sm text-blue-400 flex items-center justify-between">
                    <span>🎬 《${title}》</span>
                    <span class="text-xs text-slate-400">找到 ${candidates.length} 个候选源</span>
                </div>`;

                if (candidates.length === 0) {
                    html += `<div class="text-xs text-rose-400 py-1">未能在配置的频道中找到匹配资源</div>`;
                } else {
                    html += `<div class="space-y-2 mt-2">`;
                    candidates.forEach((cand) => {
                        const fileNames = cand.files.map(f => f.file_name).join('<br>');
                        html += `
                            <div class="bg-slate-900 border border-slate-800/80 rounded p-2.5 text-xs space-y-2">
                                <div class="flex items-center justify-between text-slate-300">
                                    <span class="font-semibold text-emerald-400"><i class="fa-brands fa-telegram"></i> 频道: ${cand.channel}</span>
                                    <span class="text-slate-400">包含 ${cand.files.length} 个视频文件</span>
                                </div>
                                <div class="bg-slate-950 p-2 rounded text-slate-400 max-h-28 overflow-y-auto font-mono text-[11px] leading-relaxed">
                                    ${fileNames}
                                </div>
                                <div class="text-right">
                                    <button onclick='confirmTransferAndSave(${JSON.stringify(movie)}, ${JSON.stringify(cand)})' class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-medium transition shadow">
                                        🚀 确认转存此版本
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
                movieSection.innerHTML = html;
                container.appendChild(movieSection);
            });

            document.getElementById('candidate-modal').classList.remove('hidden');
        }

        function closeCandidateModal() {
            document.getElementById('candidate-modal').classList.add('hidden');
        }

        async function confirmTransferAndSave(movie, candidate) {
            closeCandidateModal();
            const cookie = localStorage.getItem('quark_cookie') || '';
            
            toggleLogBox(true);
            clearLog();
            appendLogLine(`[转存启动] 📥 正在为《${movie.title}》创建专属文件夹并转存选中版本...`, 'info');
            appendLogLine(`  -> 目标频道: ${candidate.channel}`, 'info');
            appendLogLine(`  -> 提取短码: ${candidate.pwd_id}`, 'info');

            try {
                const response = await fetch('/api/transfer-selected', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        movie: movie,
                        candidate: candidate,
                        cookie: cookie
                    })
                });

                const res = await response.json();
                if (res.success) {
                    appendLogLine(`[转存成功] 🎉 ${res.message}`, 'success');
                } else {
                    appendLogLine(`[转存失败] ❌ ${res.message}`, 'error');
                }
            } catch (err) {
                appendLogLine(`[系统异常] ❌ 转存请求发生异常: ${err.message}`, 'error');
            }
        }
    </script>
