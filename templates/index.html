<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MovieSync 云影同步 - 首页</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="navbar">
        <div class="logo">🎬 MovieSync 云影同步</div>
        
        <!-- 搜索框 -->
        <div style="display: flex; gap: 8px; width: 400px;">
            <input type="text" placeholder="输入搜索的电影、电视剧、动漫..." style="flex: 1;">
            <button>搜索</button>
        </div>

        <div class="navbar-actions">
            <a href="/admin"><button class="btn-secondary">⚙️ 后台管理</button></a>
            <a href="/logout"><button class="btn-secondary" style="color: var(--danger-color);">退出</button></a>
        </div>
    </header>

    <!-- 分类筛选栏 -->
    <div style="padding: 16px 24px 0 24px; display: flex; gap: 10px;">
        <button>全部</button>
        <button class="btn-secondary">电影</button>
        <button class="btn-secondary">电视剧</button>
        <button class="btn-secondary">综艺</button>
        <button class="btn-secondary">动漫</button>
    </div>

    <!-- 影视海报展示区 -->
    <main class="poster-grid">
        <div class="poster-card">
            <img src="https://via.placeholder.com/160x230/1e293b/ffffff?text=Movie+1" alt="封面">
            <div class="title">示例电影名称 1</div>
        </div>
        <div class="poster-card">
            <img src="https://via.placeholder.com/160x230/1e293b/ffffff?text=Movie+2" alt="封面">
            <div class="title">示例电视剧 2</div>
        </div>
        <!-- 动态读取海报填充... -->
    </main>
</body>
</html>
