<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieSync - 影视智搜与转存系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
        }
        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        #log-box {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background-color: #020617;
            font-size: 13px;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 顶部导航与主操作栏 -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            
            <div class="flex items-center space-x-2">
                <button onclick="changeTag('电影')" class="nav-tag px-3.5 py-1.5 rounded text-sm font-medium transition bg-blue-600 text-white" data-tag="电影">电影</button>
                <button onclick="changeTag('电视剧')" class="nav-tag px-3.5 py-1.5 rounded text-sm font-medium transition bg-slate-800 text-slate-300 hover:bg-slate-700" data-tag="电视剧">电视剧</button>
                <button onclick="changeTag('综艺')" class="nav-tag px-3.5 py-1.5 rounded text-sm font-medium transition bg-slate-800 text-slate-300 hover:bg-slate-700" data-tag="综艺">综艺</button>
                <button onclick="changeTag('动漫')" class="nav-tag px-3.5 py-1.5 rounded text-sm font-medium transition bg-slate-800 text-slate-300 hover:bg-slate-700" data-tag="动漫">动漫</button>
                
                <button onclick="openChaseModal()" class="px-3 py-1.5 rounded text-sm font-medium bg-purple-600 hover:bg-purple-500 text-white transition flex items-center gap-1">
                    <i class="fa-solid fa-heart text-xs"></i> 一键追剧
                </button>
                <a href="/openlist" target="_blank" class="px-3 py-1.5 rounded text-sm font-medium bg-emerald-600 hover:bg-emerald-500 text-white transition flex items-center gap-1">
                    <i class="fa-solid fa-folder-open text-xs"></i> OpenList
                </a>
                <a href="https://pan.quark.cn" target="_blank" class="px-3 py-1.5 rounded text-sm font-medium bg-amber-600 hover:bg-amber-500 text-white transition flex items-center gap-1">
                    <i class="fa-solid fa-cloud text-xs"></i> 夸克端
                </a>
            </div>

            <div class="flex-1 max-w-xs md:max-w-md mx-2 relative">
                <input type="text" id="search-input" placeholder="搜索豆瓣影视资源..." 
                       class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500"
                       onkeydown="if(event.key==='Enter') doSearch()">
                <button onclick="doSearch()" class="absolute right-2 top-1.5 text-slate-400 hover:text-white">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <!-- 右侧动作按钮组与健康度看板 -->
            <div class="flex items-center space-x-2">
                <!-- 🎯 状态指示看板 -->
                <div id="cookie-status-badge" class="px-2.5 py-1 text-xs rounded bg-slate-800 text-slate-400 border border-slate-700 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-slate-500 animate-pulse"></span>
                    <span>Cookie 检测中</span>
                </div>
                <div id="channel-status-badge" class="px-2.5 py-1 text-xs rounded bg-slate-800 text-slate-400 border border-slate-700 flex items-center gap-1">
                    <i class="fa-brands fa-telegram text-sky-400"></i>
                    <span id="channel-count-text">频道 --/--</span>
                </div>

                <span class="text-xs text-slate-400 pl-1">已选 <b id="selected-count" class="text-blue-400">0</b> 部</span>
                <button onclick="selectAll(true)" class="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">全选</button>
                <button onclick="selectAll(false)" class="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">取消</button>
                <button onclick="batchTransfer()" class="px-3 py-1.5 text-xs bg-emerald-600 hover:bg-emerald-500 text-white rounded font-medium flex items-center gap-1">
                    <i class="fa-solid fa-cloud-arrow-down"></i> 批量转存
                </button>
                <button onclick="toggleLogBox()" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded flex items-center gap-1">
                    <i class="fa-solid fa-terminal"></i> 运行日志
                </button>
                <a href="/admin" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded flex items-center gap-1">
                    <i class="fa-solid fa-gear"></i> 设置
                </a>
            </div>
        </div>
    </header>

    <!-- 多维细分筛选栏 -->
    <div class="bg-slate-900/60 border-b border-slate-800/80 px-4 py-2.5 space-y-2 text-xs">
        <div class="max-w-7xl mx-auto flex flex-col space-y-2">
            <div class="flex items-center space-x-3 overflow-x-auto">
                <span class="text-slate-400 font-medium shrink-0">排序:</span>
                <button onclick="changeSort('U')" class="sort-tag text-blue-400 font-medium shrink-0" data-sort="U">热门</button>
                <button onclick="changeSort('R')" class="sort-tag text-slate-400 hover:text-white shrink-0" data-sort="R">最新</button>
                <button onclick="changeSort('S')" class="sort-tag text-slate-400 hover:text-white shrink-0" data-sort="S">高分</button>
            </div>
            <div class="flex items-center space-x-3 overflow-x-auto">
                <span class="text-slate-400 font-medium shrink-0">类型:</span>
                <div id="genre-list" class="flex items-center space-x-2 shrink-0"></div>
            </div>
            <div class="flex items-center space-x-3 overflow-x-auto">
                <span class="text-slate-400 font-medium shrink-0">地区:</span>
                <div id="region-list" class="flex items-center space-x-2 shrink-0"></div>
            </div>
            <div class="flex items-center space-x-3 overflow-x-auto">
                <span class="text-slate-400 font-medium shrink-0">年代:</span>
                <div id="year-list" class="flex items-center space-x-2 shrink-0"></div>
            </div>
        </div>
    </div>

    <!-- 主展示网格 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4">
        <div id="loading" class="text-center py-20 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-blue-500"></i>
            <p class="text-sm">正在获取豆瓣数据...</p>
        </div>
        <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 hidden"></div>
    </main>

    <!-- 追剧弹窗 -->
    <div id="chase-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-lg w-full max-w-md p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-base font-medium text-white flex items-center gap-2">
                    <i class="fa-solid fa-heart text-purple-500"></i> 一键添加自动化追剧
                </h3>
                <button onclick="closeChaseModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">剧集名称 / 豆瓣链接</label>
                    <input type="text" id="chase-title" placeholder="例如: 庆余年 第二季" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">监控更新频率</label>
                    <select id="chase-interval" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none">
                        <option value="1h">每 1 小时</option>
                        <option value="6h" selected>每 6 小时</option>
                        <option value="24h">每天</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeChaseModal()" class="px-4 py-1.5 text-xs bg-slate-800 text-slate-300 rounded hover:bg-slate-700">取消</button>
                <button onclick="submitChase()" class="px-4 py-1.5 text-xs bg-purple-600 text-white rounded hover:bg-purple-500 font-medium">确认追剧</button>
            </div>
        </div>
    </div>

    <!-- 底部固定实时日志面板 -->
    <div id="log-panel" class="fixed bottom-0 left-0 right-0 z-50 bg-slate-950 border-t border-slate-800 shadow-2xl transition-all duration-300 hidden">
        <div class="flex items-center justify-between px-4 py-2 bg-slate-900 border-b border-slate-800">
            <div class="flex items-center gap-2 text-xs text-slate-300 font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                实时转存运行日志
            </div>
            <div class="flex items-center gap-2">
                <button onclick="clearLog()" class="px-2 py-0.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">清空</button>
                <button onclick="toggleLogBox(false)" class="px-2 py-0.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">收起 ×</button>
            </div>
        </div>
        <div id="log-box" class="h-48 overflow-y-auto p-3"></div>
    </div>

    <script>
        let currentTag = '电影';
        let currentSort = 'U';
        let currentGenre = '全部';
        let currentRegion = '全部';
        let currentYear = '全部';

        const genres = ['全部', '剧情', '喜剧', '动作', '爱情', '科幻', '动画', '悬疑', '惊悚', '犯罪', '奇幻', '冒险'];
        const regions = ['全部', '中国大陆', '中国香港', '中国台湾', '美国', '日本', '韩国', '英国', '法国'];
        const years = ['全部', '2026', '2025', '2024', '2023', '2022', '2021', '2020'];

        let moviesData = [];
        let selectedIndices = new Set();

        document.addEventListener("DOMContentLoaded", () => {
            initFilterOptions();
            fetchMovies();
            checkSystemHealth();
        });

        // 🎯 恢复：检测夸克 Cookie 与 TG 频道健康度
        async function checkSystemHealth() {
            // 1. 检查 Cookie
            try {
                const resp = await fetch('/api/check-cookie', { method: 'POST' });
                const res = await resp.json();
                const badge = document.getElementById('cookie-status-badge');
                if (res.valid) {
                    badge.className = "px-2.5 py-1 text-xs rounded bg-emerald-950/80 text-emerald-400 border border-emerald-800 flex items-center gap-1.5";
                    badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>Cookie 有效</span>`;
                } else {
                    badge.className = "px-2.5 py-1 text-xs rounded bg-rose-950/80 text-rose-400 border border-rose-800 flex items-center gap-1.5";
                    badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span><span>Cookie 失效</span>`;
                }
            } catch (err) {
                console.error("Cookie 状态检查异常:", err);
            }

            // 2. 检查 TG 频道连通数
            try {
                const resp = await fetch('/api/check-channels');
                const res = await resp.json();
                if (res.success) {
                    document.getElementById('channel-count-text').innerText = `频道 ${res.valid_count}/${res.total}`;
                }
            } catch (err) {
                console.error("频道检测异常:", err);
            }
        }

        function initFilterOptions() {
            renderFilterRow('genre-list', genres, currentGenre, (val) => { currentGenre = val; fetchMovies(); });
            renderFilterRow('region-list', regions, currentRegion, (val) => { currentRegion = val; fetchMovies(); });
            renderFilterRow('year-list', years, currentYear, (val) => { currentYear = val; fetchMovies(); });
        }

        function renderFilterRow(containerId, items, activeVal, onClick) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            items.forEach(item => {
                const btn = document.createElement('button');
                btn.className = item === activeVal ? 'text-blue-400 font-medium' : 'text-slate-400 hover:text-white';
                btn.innerText = item;
                btn.onclick = () => {
                    renderFilterRow(containerId, items, item, onClick);
                    onClick(item);
                };
                container.appendChild(btn);
            });
        }

        function changeTag(tag) {
            currentTag = tag;
            document.querySelectorAll('.nav-tag').forEach(btn => {
                btn.className = btn.dataset.tag === tag 
                    ? 'nav-tag px-3.5 py-1.5 rounded text-sm font-medium transition bg-blue-600 text-white'
                    : 'nav-tag px-3.5 py-1.5 rounded text-sm font-medium transition bg-slate-800 text-slate-300 hover:bg-slate-700';
            });
            fetchMovies();
        }

        function changeSort(sort) {
            currentSort = sort;
            document.querySelectorAll('.sort-tag').forEach(btn => {
                btn.className = btn.dataset.sort === sort ? 'sort-tag text-blue-400 font-medium shrink-0' : 'sort-tag text-slate-400 hover:text-white shrink-0';
            });
            fetchMovies();
        }

        async function fetchMovies() {
            const loading = document.getElementById('loading');
            const grid = document.getElementById('movie-grid');
            loading.classList.remove('hidden');
            grid.classList.add('hidden');
            selectedIndices.clear();
            updateSelectedCount();

            try {
                const url = `/api/get-movies?tag=${encodeURIComponent(currentTag)}&sort=${currentSort}&genre=${encodeURIComponent(currentGenre)}&region=${encodeURIComponent(currentRegion)}&year=${encodeURIComponent(currentYear)}`;
                const resp = await fetch(url);
                const res = await resp.json();
                if (res.success) {
                    moviesData = res.movies || [];
                    renderGrid();
                } else {
                    alert('获取资源失败: ' + res.message);
                }
            } catch (err) {
                console.error(err);
            } finally {
                loading.classList.add('hidden');
                grid.classList.remove('hidden');
            }
        }

        async function doSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            const loading = document.getElementById('loading');
            const grid = document.getElementById('movie-grid');
            loading.classList.remove('hidden');
            grid.classList.add('hidden');
            selectedIndices.clear();
            updateSelectedCount();

            try {
                const resp = await fetch(`/api/search-douban?q=${encodeURIComponent(query)}`);
                const res = await resp.json();
                if (res.success) {
                    moviesData = res.movies || [];
                    renderGrid();
                }
            } catch (err) {
                console.error(err);
            } finally {
                loading.classList.add('hidden');
                grid.classList.remove('hidden');
            }
        }

        function renderGrid() {
            const grid = document.getElementById('movie-grid');
            grid.innerHTML = '';

            moviesData.forEach((movie, idx) => {
                const coverUrl = movie.cover ? `/api/proxy-img?url=${encodeURIComponent(movie.cover)}` : 'https://via.placeholder.com/150x220?text=No+Cover';
                const isSelected = selectedIndices.has(idx);

                const card = document.createElement('div');
                card.className = `relative group bg-slate-900 border ${isSelected ? 'border-blue-500' : 'border-slate-800'} rounded-lg overflow-hidden card-shadow cursor-pointer transition`;
                card.onclick = (e) => {
                    if (e.target.tagName !== 'A') {
                        toggleSelect(idx);
                    }
                };

                card.innerHTML = `
                    <div class="aspect-[2/3] w-full bg-slate-950 relative overflow-hidden">
                        <img src="${coverUrl}" alt="${movie.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                        <div class="absolute top-2 left-2 z-10">
                            <input type="checkbox" ${isSelected ? 'checked' : ''} class="w-4 h-4 rounded border-slate-600 bg-slate-900/80 text-blue-600 focus:ring-0">
                        </div>
                        <div class="absolute top-2 right-2 bg-slate-900/90 backdrop-blur text-amber-400 text-[11px] font-bold px-1.5 py-0.5 rounded border border-slate-700/50">
                            ${movie.rate || '暂无'}
                        </div>
                    </div>
                    <div class="p-2.5">
                        <div class="font-medium text-xs text-slate-200 line-clamp-1 group-hover:text-blue-400 transition" title="${movie.title}">${movie.title}</div>
                        <div class="mt-1 flex items-center justify-between text-[11px]">
                            <a href="${movie.url}" target="_blank" class="text-blue-400 hover:underline">详情</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleSelect(idx) {
            if (selectedIndices.has(idx)) selectedIndices.delete(idx);
            else selectedIndices.add(idx);
            updateSelectedCount();
            renderGrid();
        }

        function selectAll(select) {
            if (select) moviesData.forEach((_, idx) => selectedIndices.add(idx));
            else selectedIndices.clear();
            updateSelectedCount();
            renderGrid();
        }

        function updateSelectedCount() {
            document.getElementById('selected-count').innerText = selectedIndices.size;
        }

        function toggleLogBox(show = true) {
            const panel = document.getElementById('log-panel');
            if (show) panel.classList.remove('hidden');
            else panel.classList.toggle('hidden');
        }

        function clearLog() {
            document.getElementById('log-box').innerHTML = '';
        }

        function appendLogLine(text) {
            const logBox = document.getElementById('log-box');
            if (!text) return;
            const lines = text.split('\n');
            lines.forEach(line => {
                if (line.trim().length > 0) {
                    const div = document.createElement('div');
                    div.className = 'py-0.5 font-mono leading-relaxed text-sky-400 border-b border-slate-900/40';
                    div.textContent = line;
                    logBox.appendChild(div);
                }
            });
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function batchTransfer() {
            if (selectedIndices.size === 0) return alert('请先选择至少一部影片');

            const cookie = localStorage.getItem('quark_cookie') || '';
            const selectedMovies = Array.from(selectedIndices).map(idx => {
                const item = moviesData[idx];
                return {
                    title: item.title,
                    tag: currentTag || '电影',
                    cover: item.cover,
                    url: item.url
                };
            });
            
            toggleLogBox(true);
            clearLog();
            
            try {
                const response = await fetch('/api/transfer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        movies: selectedMovies,
                        cookie: cookie
                    })
                });

                if (!response.ok) {
                    appendLogLine(`[系统] ❌ 请求失败，HTTP 状态码: ${response.status}`);
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    appendLogLine(chunk);
                }
            } catch (err) {
                appendLogLine(`[系统] ❌ 传输发生网络异常: ${err.message}`);
            }
        }
    </script>
</body>
</html>
