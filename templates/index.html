<!-- MovieSync 主页面
     用途：豆瓣影视浏览/搜索、候选资源检索、白名单转存、OpenList 入口和自动追剧管理。
     维护说明：页面主要负责 UI；实际认证、豆瓣数据、资源解析和转存均由后端 API 完成。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>MovieSync - 影视智搜与转存系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen flex flex-col">

    <!-- 顶栏：左侧分类/功能，中间搜索框，右侧系统状态与设置（吸顶 + 毛玻璃） -->
    <header class="glass-nav backdrop-blur-xl border-b border-slate-800/70 sticky top-0 z-40 px-3 sm:px-4 py-2.5">
        <div class="max-w-screen-2xl mx-auto flex flex-wrap lg:flex-nowrap items-center justify-between gap-2 sm:gap-4">
            
            <!-- 左侧：分类与功能入口 -->
            <div class="flex items-center space-x-1.5 shrink-0 overflow-x-auto max-w-full">
                <button onclick="changeTag('电影')" class="nav-tag px-3.5 py-1.5 glass-tab rounded-xl text-sm font-medium transition bg-blue-600/90 text-white shadow-lg shadow-blue-600/10" data-tag="电影">电影</button>
                <button onclick="changeTag('电视剧')" class="nav-tag px-3.5 py-1.5 glass-tab rounded-xl text-sm font-medium transition bg-slate-900/50 text-slate-300 hover:bg-slate-800/80" data-tag="电视剧">电视剧</button>
                <button onclick="changeTag('综艺')" class="nav-tag px-3.5 py-1.5 rounded text-sm font-medium transition bg-slate-800/80 text-slate-300 hover:bg-slate-700" data-tag="综艺">综艺</button>
                <button onclick="changeTag('动漫')" class="nav-tag px-3.5 py-1.5 rounded text-sm font-medium transition bg-slate-800/80 text-slate-300 hover:bg-slate-700" data-tag="动漫">动漫</button>
                
                <a href="/tasks" class="px-2.5 py-1.5 rounded text-xs font-medium bg-purple-600/90 hover:bg-purple-500 text-white transition flex items-center gap-1 shadow-lg shadow-purple-600/10">
                    <i class="fa-solid fa-list-check"></i> 任务中心
                </a>
                <a href="/openlist" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1.5 rounded text-xs font-medium bg-emerald-600/90 hover:bg-emerald-500 text-white transition flex items-center gap-1 shadow-lg shadow-emerald-600/10">
                    <i class="fa-solid fa-folder-open"></i> OpenList
                </a>
                <a href="https://pan.quark.cn" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1.5 rounded text-xs font-medium bg-amber-600/90 hover:bg-amber-500 text-white transition flex items-center gap-1 shadow-lg shadow-amber-600/10">
                    <i class="fa-solid fa-cloud"></i> 夸克端
                </a>
            </div>

            <!-- 中间：搜索框 -->
            <div class="order-last lg:order-none w-full lg:flex-1 lg:max-w-xl lg:mx-2 relative">
                <input type="text" id="search-input" placeholder="搜索豆瓣影视资源..." 
                       class="w-full glass-control bg-slate-950/55 border border-slate-700/60 rounded-xl px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 shadow-inner"
                       onkeydown="if(event.key==='Enter') doSearch()">
                <button onclick="doSearch()" class="absolute right-3 top-2 text-slate-400 hover:text-white text-xs">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <!-- 右侧：Cookie状态、频道检测、运行日志、设置 -->
            <div class="hidden sm:flex items-center space-x-2 shrink-0">
                <div id="cookie-status-badge" class="px-2 py-1 text-xs rounded glass-badge bg-slate-900/55 text-slate-400 border border-slate-700/60 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-slate-500 animate-pulse"></span>
                    <span>检测中</span>
                </div>
                <div id="channel-status-badge" class="px-2 py-1 text-xs rounded bg-slate-800/80 text-slate-400 border border-slate-700/80 flex items-center gap-1">
                    <i class="fa-brands fa-telegram text-sky-400"></i>
                    <span id="channel-count-text">频道 --/--</span>
                </div>
                <a href="/admin" class="px-2.5 py-1.5 text-xs glass-control bg-slate-900/55 hover:bg-slate-800/80 text-slate-300 rounded-xl border border-slate-700/60 flex items-center gap-1">
                    <i class="fa-solid fa-gear"></i> 设置
                </a>
            </div>
        </div>
    </header>

    <!-- 第二行：排序方式与超宽资源选择显示栏（吸顶 + 毛玻璃） -->
    <div class="glass-subnav backdrop-blur-xl border-b border-slate-800/60 px-4 py-2.5 sticky top-[57px] z-30 shadow-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            
            <!-- 左侧：排序方式 + 已选统计 + 影片名称预览区 -->
            <div class="flex items-center space-x-4 flex-1 overflow-hidden">
                <div class="flex items-center space-x-2 shrink-0">
                    <span class="text-xs text-slate-400 font-medium">排序方式：</span>
                    <div class="inline-flex bg-slate-950/55 p-1 rounded-xl border border-slate-700/60 text-xs gap-1">
                        <button onclick="changeSort('U')" class="sort-tag px-3 py-1.5 rounded-lg font-medium transition bg-blue-600/90 text-white shadow" data-sort="U">
                            <i class="fa-solid fa-fire mr-1 text-amber-300"></i> 热门推荐
                        </button>
                        <button onclick="changeSort('R')" class="sort-tag px-3 py-1.5 rounded-lg font-medium transition text-slate-400 hover:text-white" data-sort="R">
                            <i class="fa-solid fa-clock mr-1 text-sky-300"></i> 最近最新
                        </button>
                    </div>
                </div>

                <div class="h-4 w-px bg-slate-800 shrink-0"></div>

                <div class="flex items-center space-x-3 flex-1 overflow-hidden">
                    <div class="flex items-center space-x-1.5 shrink-0">
                        <span class="text-xs text-slate-400">已选 <b id="selected-count" class="text-blue-400">0</b> 部</span>
                        <button onclick="selectAll(true)" class="px-2.5 py-1.5 text-[11px] bg-slate-900/60 hover:bg-slate-800 text-slate-300 rounded-lg border border-slate-700/50">全选</button>
                        <button onclick="selectAll(false)" class="px-2 py-1 text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded">取消</button>
                    </div>
                    
                    <!-- 资源名称预览显示区 -->
                    <div id="selected-titles-preview" class="flex items-center gap-1.5 overflow-hidden text-xs flex-1"></div>
                </div>
            </div>

            <!-- 右侧：转存资源按钮 -->
            <div class="shrink-0">
                <button onclick="batchTransfer()" class="px-4 py-2 text-xs bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-medium flex items-center gap-1.5 shadow-lg shadow-emerald-600/20 transition">
                    <i class="fa-solid fa-cloud-arrow-down text-sm"></i> 转存资源
                </button>
            </div>

        </div>
    </div>

    <!-- 主展示网格 -->
    <main class="flex-1 max-w-screen-2xl w-full mx-auto p-3 sm:p-4">
        <div id="loading" class="text-center py-20 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-blue-500"></i>
            <p class="text-sm">正在获取豆瓣数据...</p>
        </div>
        <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-7 2xl:grid-cols-8 gap-3 sm:gap-4 hidden"></div>
        <div id="empty-state" class="hidden min-h-[45vh] flex items-center justify-center">
            <div class="text-center max-w-sm">
                <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-slate-900 border border-slate-800 text-slate-500">
                    <i class="fa-solid fa-film text-xl"></i>
                </div>
                <h2 class="text-sm font-semibold text-slate-200">没有找到影视内容</h2>
                <p class="mt-2 text-xs leading-6 text-slate-500">可以换一个关键词，或者切换“热门推荐 / 最近最新”再试试。</p>
            </div>
        </div>
    </main>

    <div id="toast-container" class="fixed right-3 top-20 z-[200] flex w-[min(360px,calc(100vw-24px))] flex-col gap-2 pointer-events-none"></div>

    <!-- 影视详情操作抽屉：海报点击后的统一入口 -->
    <div id="movie-detail-drawer" class="fixed inset-0 z-[90] hidden">
        <div onclick="closeMovieDetail()" class="absolute inset-0 bg-black/65 backdrop-blur-sm"></div>
        <aside class="absolute right-0 top-0 h-full w-full max-w-xl overflow-y-auto border-l border-slate-700/60 bg-slate-900/75 backdrop-blur-2xl shadow-2xl">
            <div class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-700/60 bg-slate-900/70 px-5 py-4 backdrop-blur">
                <div>
                    <div class="text-[10px] font-medium uppercase tracking-widest text-blue-400">MOVIE ACTIONS</div>
                    <h2 id="movie-detail-title" class="mt-1 text-base font-semibold text-white">影视详情</h2>
                </div>
                <button onclick="closeMovieDetail()" class="rounded-md px-2 py-1 text-slate-400 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-5 p-5">
                <div class="flex gap-4 glass-card rounded-2xl p-4">
                    <img id="movie-detail-cover" class="h-40 w-28 shrink-0 rounded-xl object-cover bg-slate-900" alt="">
                    <div class="min-w-0">
                        <h3 id="movie-detail-name" class="text-lg font-semibold text-white"></h3>
                        <div id="movie-detail-meta" class="mt-2 text-xs leading-6 text-slate-400"></div>
                        <a id="movie-detail-douban" href="#" target="_blank" rel="noopener noreferrer" class="mt-3 inline-flex items-center gap-1.5 rounded-lg border border-blue-900/60 bg-blue-950/40 px-3 py-1.5 text-[11px] text-blue-300 hover:bg-blue-900/50">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> 豆瓣详情
                        </a>
                    </div>
                </div>
                <div>
                    <div class="mb-2 text-xs font-semibold text-slate-300">你想对这部影视做什么？</div>
                    <div class="grid gap-3 sm:grid-cols-2">
                        <button onclick="movieDetailTransfer()" class="group rounded-2xl border border-emerald-800/70 bg-emerald-950/30 p-4 text-left hover:border-emerald-600 hover:bg-emerald-950/50">
                            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-emerald-600/20 text-emerald-400"><i class="fa-solid fa-cloud-arrow-down"></i></div>
                            <div class="mt-3 text-sm font-semibold text-white">转存资源</div>
                            <div class="mt-1 text-[11px] leading-5 text-slate-400">搜索频道中的可用资源，选择版本和文件后转存到夸克。</div>
                        </button>
                        <button onclick="movieDetailChase()" class="group rounded-2xl border border-purple-800/70 bg-purple-950/30 p-4 text-left hover:border-purple-600 hover:bg-purple-950/50">
                            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-purple-600/20 text-purple-400"><i class="fa-solid fa-rotate"></i></div>
                            <div class="mt-3 text-sm font-semibold text-white">添加追剧</div>
                            <div class="mt-1 text-[11px] leading-5 text-slate-400">找到稳定分享源后持续监控，新集出现时自动执行转存。</div>
                        </button>
                    </div>
                </div>
                <div class="rounded-xl border border-slate-800 bg-slate-950/70 p-4">
                    <div class="flex items-center gap-2 text-xs font-medium text-slate-300"><i class="fa-solid fa-circle-info text-blue-400"></i> 说明</div>
                    <p class="mt-2 text-[11px] leading-5 text-slate-500">普通转存和自动追剧都会进入任务中心。转存过程中不再要求你盯着底部日志，可以随时关闭页面继续浏览。</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- 批量转存资源弹窗 -->
    <div id="candidate-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center hidden">
        <div class="candidate-modal-shell bg-slate-900/95 border border-slate-700/80 rounded-2xl w-full max-w-5xl p-4 sm:p-5 shadow-2xl space-y-4 max-h-[92vh] flex flex-col backdrop-blur-xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center gap-3">
                    <h3 class="text-base font-medium text-white flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-blue-500"></i> 选择要转存的资源版本及文件白名单
                    </h3>
                </div>
                <button onclick="closeCandidateModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <div class="target-folder-bar bg-slate-950/80 border border-slate-800 rounded-xl p-3 flex flex-col sm:flex-row sm:items-center gap-2.5">
                <span class="text-xs font-semibold text-amber-400 shrink-0"><i class="fa-solid fa-folder-tree"></i> 目标存储目录:</span>
                <select id="batch-target-fid" class="global-category-select flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                    <option value="0">正在加载后台分类目录配置...</option>
                </select>
                <span class="text-[10px] text-slate-500 shrink-0">每部影片会自动建立专属文件夹</span>
            </div>

            <div id="candidate-content" class="flex-1 overflow-y-auto space-y-4 pr-1"></div>
            
            <div class="flex justify-end pt-2 border-t border-slate-800">
                <button onclick="closeCandidateModal()" class="px-4 py-2 text-xs bg-slate-800 text-slate-300 rounded hover:bg-slate-700">关闭</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
