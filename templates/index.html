<!-- MovieSync 主页面
     用途：豆瓣影视浏览/搜索、候选资源检索、白名单转存、OpenList 入口和自动追剧管理。
     维护说明：页面主要负责 UI；实际认证、豆瓣数据、资源解析和转存均由后端 API 完成。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>MovieSync - 影视智搜与转存系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen flex flex-col">

    <!-- 顶栏：左侧分类/功能，中间搜索框，右侧系统状态与设置（吸顶 + 毛玻璃） -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-40 px-3 sm:px-4 py-2.5">
        <div class="max-w-screen-2xl mx-auto flex flex-wrap lg:flex-nowrap items-center justify-between gap-2 sm:gap-4">
            
            <!-- 左侧：分类与功能入口 -->
            <div class="flex items-center space-x-1.5 shrink-0 overflow-x-auto max-w-full">
                <button onclick="changeTag('电影')" class="nav-tag px-3.5 py-1.5 rounded text-sm font-medium transition bg-blue-600 text-white shadow-md" data-tag="电影">电影</button>
                <button onclick="changeTag('电视剧')" class="nav-tag px-3.5 py-1.5 rounded text-sm font-medium transition bg-slate-800/80 text-slate-300 hover:bg-slate-700" data-tag="电视剧">电视剧</button>
                <button onclick="changeTag('综艺')" class="nav-tag px-3.5 py-1.5 rounded text-sm font-medium transition bg-slate-800/80 text-slate-300 hover:bg-slate-700" data-tag="综艺">综艺</button>
                <button onclick="changeTag('动漫')" class="nav-tag px-3.5 py-1.5 rounded text-sm font-medium transition bg-slate-800/80 text-slate-300 hover:bg-slate-700" data-tag="动漫">动漫</button>
                
                <a href="/tasks" class="px-2.5 py-1.5 rounded text-xs font-medium bg-purple-600 hover:bg-purple-500 text-white transition flex items-center gap-1 shadow">
                    <i class="fa-solid fa-list-check"></i> 任务中心
                </a>
                <a href="/openlist" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1.5 rounded text-xs font-medium bg-emerald-600 hover:bg-emerald-500 text-white transition flex items-center gap-1 shadow">
                    <i class="fa-solid fa-folder-open"></i> OpenList
                </a>
                <a href="https://pan.quark.cn" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1.5 rounded text-xs font-medium bg-amber-600 hover:bg-amber-500 text-white transition flex items-center gap-1 shadow">
                    <i class="fa-solid fa-cloud"></i> 夸克端
                </a>
            </div>

            <!-- 中间：搜索框 -->
            <div class="order-last lg:order-none w-full lg:flex-1 lg:max-w-xl lg:mx-2 relative">
                <input type="text" id="search-input" placeholder="搜索豆瓣影视资源..." 
                       class="w-full bg-slate-950/80 border border-slate-700/80 rounded-lg px-3.5 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 shadow-inner"
                       onkeydown="if(event.key==='Enter') doSearch()">
                <button onclick="doSearch()" class="absolute right-3 top-2 text-slate-400 hover:text-white text-xs">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <!-- 右侧：Cookie状态、频道检测、运行日志、设置 -->
            <div class="hidden sm:flex items-center space-x-2 shrink-0">
                <div id="cookie-status-badge" class="px-2 py-1 text-xs rounded bg-slate-800/80 text-slate-400 border border-slate-700/80 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-slate-500 animate-pulse"></span>
                    <span>检测中</span>
                </div>
                <div id="channel-status-badge" class="px-2 py-1 text-xs rounded bg-slate-800/80 text-slate-400 border border-slate-700/80 flex items-center gap-1">
                    <i class="fa-brands fa-telegram text-sky-400"></i>
                    <span id="channel-count-text">频道 --/--</span>
                </div>
                <button onclick="toggleLogBox()" class="px-2.5 py-1.5 text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded border border-slate-700/50 flex items-center gap-1">
                    <i class="fa-solid fa-terminal"></i> 运行日志
                </button>
                <a href="/admin" class="px-2.5 py-1.5 text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded border border-slate-700/50 flex items-center gap-1">
                    <i class="fa-solid fa-gear"></i> 设置
                </a>
            </div>
        </div>
    </header>

    <!-- 第二行：排序方式与超宽资源选择显示栏（吸顶 + 毛玻璃） -->
    <div class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-2.5 sticky top-[57px] z-30 shadow-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            
            <!-- 左侧：排序方式 + 已选统计 + 影片名称预览区 -->
            <div class="flex items-center space-x-4 flex-1 overflow-hidden">
                <div class="flex items-center space-x-2 shrink-0">
                    <span class="text-xs text-slate-400 font-medium">排序方式：</span>
                    <div class="inline-flex bg-slate-950/80 p-0.5 rounded-lg border border-slate-800 text-xs gap-1">
                        <button onclick="changeSort('U')" class="sort-tag px-3 py-1 rounded-md font-medium transition bg-blue-600 text-white shadow" data-sort="U">
                            <i class="fa-solid fa-fire mr-1 text-amber-300"></i> 热门推荐
                        </button>
                        <button onclick="changeSort('R')" class="sort-tag px-3 py-1 rounded-md font-medium transition text-slate-400 hover:text-white" data-sort="R">
                            <i class="fa-solid fa-clock mr-1 text-sky-300"></i> 最近最新
                        </button>
                    </div>
                </div>

                <div class="h-4 w-px bg-slate-800 shrink-0"></div>

                <div class="flex items-center space-x-3 flex-1 overflow-hidden">
                    <div class="flex items-center space-x-1.5 shrink-0">
                        <span class="text-xs text-slate-400">已选 <b id="selected-count" class="text-blue-400">0</b> 部</span>
                        <button onclick="selectAll(true)" class="px-2 py-1 text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded">全选</button>
                        <button onclick="selectAll(false)" class="px-2 py-1 text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded">取消</button>
                    </div>
                    
                    <!-- 资源名称预览显示区 -->
                    <div id="selected-titles-preview" class="flex items-center gap-1.5 overflow-hidden text-xs flex-1"></div>
                </div>
            </div>

            <!-- 右侧：转存资源按钮 -->
            <div class="shrink-0">
                <button onclick="batchTransfer()" class="px-4 py-2 text-xs bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-medium flex items-center gap-1.5 shadow-lg shadow-emerald-600/20 transition">
                    <i class="fa-solid fa-cloud-arrow-down text-sm"></i> 转存资源
                </button>
            </div>

        </div>
    </div>

    <!-- 主展示网格 -->
    <main class="flex-1 max-w-screen-2xl w-full mx-auto p-3 sm:p-4">
        <div id="loading" class="text-center py-20 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-blue-500"></i>
            <p class="text-sm">正在获取豆瓣数据...</p>
        </div>
        <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-7 2xl:grid-cols-8 gap-3 sm:gap-4 hidden"></div>
        <div id="empty-state" class="hidden min-h-[45vh] flex items-center justify-center">
            <div class="text-center max-w-sm">
                <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-slate-900 border border-slate-800 text-slate-500">
                    <i class="fa-solid fa-film text-xl"></i>
                </div>
                <h2 class="text-sm font-semibold text-slate-200">没有找到影视内容</h2>
                <p class="mt-2 text-xs leading-6 text-slate-500">可以换一个关键词，或者切换“热门推荐 / 最近最新”再试试。</p>
            </div>
        </div>
    </main>

    <div id="toast-container" class="fixed right-3 top-20 z-[200] flex w-[min(360px,calc(100vw-24px))] flex-col gap-2 pointer-events-none"></div>

    <!-- 批量转存资源弹窗 -->
    <div id="candidate-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-lg w-full max-w-4xl p-6 shadow-2xl space-y-4 max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center gap-3">
                    <h3 class="text-base font-medium text-white flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-blue-500"></i> 选择要转存的资源版本及文件白名单
                    </h3>
                </div>
                <button onclick="closeCandidateModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <div class="bg-slate-950 border border-slate-800 rounded-lg p-3 flex items-center gap-3">
                <span class="text-xs font-semibold text-amber-400 shrink-0"><i class="fa-solid fa-folder-tree"></i> 目标存储目录:</span>
                <select id="batch-target-fid" class="global-category-select flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                    <option value="0">正在加载后台分类目录配置...</option>
                </select>
                <span class="text-[11px] text-slate-400 shrink-0">(将自动在此目录下新建影片专属文件夹)</span>
            </div>

            <div id="candidate-content" class="flex-1 overflow-y-auto space-y-4 pr-1"></div>
            
            <div class="flex justify-end pt-2 border-t border-slate-800">
                <button onclick="closeCandidateModal()" class="px-4 py-2 text-xs bg-slate-800 text-slate-300 rounded hover:bg-slate-700">关闭</button>
            </div>
        </div>
    </div>

    <!-- 底部固定实时日志面板（使用 40% 透明度 + 强模糊，展现真实透光毛玻璃效果） -->
    <div id="log-panel" class="fixed bottom-0 left-0 right-0 z-50 bg-slate-950/40 backdrop-blur-2xl border-t border-slate-700/40 shadow-2xl transition-all duration-300 hidden">
        <div class="flex items-center justify-between px-4 py-2 bg-slate-900/40 backdrop-blur-xl border-b border-slate-800/40">
            <div class="flex items-center gap-2 text-xs text-slate-300 font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>实时转存运行日志</span>
                <span id="log-timer-badge" class="ml-2 px-2 py-0.5 rounded bg-blue-950/80 text-blue-400 font-mono text-[11px] hidden">耗时: 0 秒</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="clearLog()" class="px-2 py-0.5 text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded">清空</button>
                <button onclick="toggleLogBox(false)" class="px-2 py-0.5 text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded">收起 ×</button>
            </div>
        </div>
        <div id="log-box" class="h-48 overflow-y-auto p-3 bg-transparent"></div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
