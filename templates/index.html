<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆瓣全局搜索转存夸克网盘服务</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="layout-container">
        <!-- 左侧主内容区域 -->
        <div class="left-main">
            <header>
                <div class="logo">🎬 豆瓣全局搜索转存夸克网盘服务</div>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="输入你想找的电影、热播剧集、综艺、动漫..." onkeydown="if(event.key==='Enter') searchMovies()">
                    <button class="btn" onclick="searchMovies()">搜索</button>
                </div>
            </header>

            <!-- 顶部分类 Tab 与 工具快捷按钮 -->
            <div class="top-action-bar">
                <div class="tab-group">
                    <button class="tab-btn active" id="tab-电影" onclick="switchCategory('电影')">🎬 电影</button>
                    <button class="tab-btn" id="tab-电视剧" onclick="switchCategory('电视剧')">📺 电视剧</button>
                    <button class="tab-btn" id="tab-综艺" onclick="switchCategory('综艺')">🎤 综艺</button>
                    <button class="tab-btn" id="tab-动漫" onclick="switchCategory('动漫')">🎨 动漫</button>
                </div>

                <div class="right-tools">
                    <!-- 🌟 新增：在线观看与唤起夸克客户端按钮 -->
                    <button class="btn-tool btn-openlist" onclick="openOpenList()" title="点击在新窗口打开 OpenList 播放视频">📺 在线观看</button>
                    <button class="btn-tool btn-quark" onclick="openQuarkApp()" title="调用电脑本地已安装的夸克网盘客户端">📥 夸克客户端</button>

                    <span class="select-count">已选 <b id="selected-count">0</b> 部</span>
                    <button class="btn-sm" onclick="selectAll()">全选</button>
                    <button class="btn-sm" onclick="clearSelection()">取消</button>
                    <button class="btn-transfer-top" onclick="startBatchTransfer()">
                        🚀 一键批量转存勾选项
                    </button>
                </div>
            </div>

            <!-- 多维筛选栏 -->
            <div class="filter-panel" id="filter-panel">
                <div class="filter-row">
                    <span class="filter-label">排序:</span>
                    <div class="filter-options" id="filter-sort">
                        <span class="filter-item active" onclick="setFilter('sort', 'U', this)">热门</span>
                        <span class="filter-item" onclick="setFilter('sort', 'R', this)">最新</span>
                        <span class="filter-item" onclick="setFilter('sort', 'S', this)">高分</span>
                        <span class="filter-item" onclick="setFilter('sort', 'T', this)">最多评价</span>
                    </div>
                </div>

                <div class="filter-row">
                    <span class="filter-label">类型:</span>
                    <div class="filter-options" id="filter-genre">
                        <span class="filter-item active" onclick="setFilter('genre', '', this)">全部</span>
                        <span class="filter-item" onclick="setFilter('genre', '剧情', this)">剧情</span>
                        <span class="filter-item" onclick="setFilter('genre', '喜剧', this)">喜剧</span>
                        <span class="filter-item" onclick="setFilter('genre', '动作', this)">动作</span>
                        <span class="filter-item" onclick="setFilter('genre', '爱情', this)">爱情</span>
                        <span class="filter-item" onclick="setFilter('genre', '科幻', this)">科幻</span>
                        <span class="filter-item" onclick="setFilter('genre', '悬疑', this)">悬疑</span>
                        <span class="filter-item" onclick="setFilter('genre', '犯罪', this)">犯罪</span>
                        <span class="filter-item" onclick="setFilter('genre', '动画', this)">动画</span>
                        <span class="filter-item" onclick="setFilter('genre', '惊悚', this)">惊悚</span>
                    </div>
                </div>

                <div class="filter-row">
                    <span class="filter-label">地区:</span>
                    <div class="filter-options" id="filter-country">
                        <span class="filter-item active" onclick="setFilter('country', '', this)">全部</span>
                        <span class="filter-item" onclick="setFilter('country', '中国大陆', this)">中国大陆</span>
                        <span class="filter-item" onclick="setFilter('country', '美国', this)">美国</span>
                        <span class="filter-item" onclick="setFilter('country', '中国香港', this)">中国香港</span>
                        <span class="filter-item" onclick="setFilter('country', '中国台湾', this)">中国台湾</span>
                        <span class="filter-item" onclick="setFilter('country', '日本', this)">日本</span>
                        <span class="filter-item" onclick="setFilter('country', '韩国', this)">韩国</span>
                        <span class="filter-item" onclick="setFilter('country', '英国', this)">英国</span>
                    </div>
                </div>

                <div class="filter-row">
                    <span class="filter-label">年份:</span>
                    <div class="filter-options" id="filter-year">
                        <span class="filter-item active" onclick="setFilter('year', '', this)">全部</span>
                        <span class="filter-item" onclick="setFilter('year', '2026,2026', this)">2026</span>
                        <span class="filter-item" onclick="setFilter('year', '2025,2025', this)">2025</span>
                        <span class="filter-item" onclick="setFilter('year', '2024,2024', this)">2024</span>
                        <span class="filter-item" onclick="setFilter('year', '2023,2023', this)">2023</span>
                        <span class="filter-item" onclick="setFilter('year', '2020,2029', this)">2020年代</span>
                        <span class="filter-item" onclick="setFilter('year', '2010,2019', this)">2010年代</span>
                    </div>
                </div>
            </div>

            <!-- 8列卡片海报墙 -->
            <div class="content-area">
                <div class="movie-grid" id="movie-grid"></div>
            </div>
        </div>

        <!-- 右侧全高贯穿 Sidebar -->
        <div class="log-sidebar">
            <div class="sidebar-top-bar">
                <button class="btn config-btn" onclick="openConfigModal()">⚙️ 配置设置</button>
            </div>

            <div class="status-panel">
                <div class="status-header">
                    <span class="status-title">⚡ 系统状态监控</span>
                    <button class="btn-sm" style="font-size:11px; padding:2px 8px;" onclick="refreshStatus()">🔄 刷新</button>
                </div>
                <div class="status-items">
                    <div class="status-item">
                        <span>夸克 Cookie:</span>
                        <span id="quark-status-badge" class="badge badge-warning">检查中...</span>
                    </div>
                    <div class="status-item">
                        <span>TG 检索频道:</span>
                        <span id="channel-status-badge" class="badge badge-info">探测中...</span>
                    </div>
                </div>
            </div>

            <div class="log-container">
                <div class="log-header">
                    <span>🟢 实时运行日志</span>
                    <button class="btn-sm" onclick="clearLog()">清空</button>
                </div>
                <div class="log-body" id="log-body">系统就绪，等待触发转存任务...</div>
            </div>
        </div>
    </div>

    <!-- 配置 Modal -->
    <div class="modal" id="config-modal">
        <div class="modal-content">
            <h3>⚙ 系统与服务集成配置</h3>
            
            <div class="section-title">☁️ 夸克网盘配置</div>
            <label style="font-size:13px; color:#94a3b8;">夸克 Cookie:</label>
            <input type="text" id="quark-cookie-input" placeholder="粘贴完整的夸克 Cookie...">
            
            <label style="font-size:13px; color:#94a3b8;">目标保存目录 FID (默认 0 表示根目录):</label>
            <input type="text" id="folder-id-input" placeholder="默认 0">

            <!-- 🌟 新增：外部应用与在线观看集成 -->
            <div class="section-title">🔗 外部工具集成</div>
            <label style="font-size:13px; color:#94a3b8;">OpenList 在线播放地址 (例: http://192.168.1.100:5244):</label>
            <input type="text" id="openlist-url-input" placeholder="http://192.168.x.x:5244">

            <label style="font-size:13px; color:#94a3b8;">夸克客户端唤起协议 (默认 quark://):</label>
            <input type="text" id="quark-app-input" placeholder="quark://">

            <div class="section-title">
                <span>📺 检索频道配置</span>
                <div>
                    <button class="btn-sm" style="font-size:12px; margin-right:4px;" onclick="importChannelsJson()">📥 批量导入 JSON</button>
                    <button class="btn-sm" style="font-size:12px;" onclick="fetchChannels()">刷新频道</button>
                </div>
            </div>

            <div class="channel-list-box" id="channel-list-box"></div>

            <div class="add-channel-row">
                <input type="text" id="new-ch-name" placeholder="频道名称 (例: 夸克影视)" style="flex: 1;">
                <input type="text" id="new-ch-id" placeholder="Telegram频道ID (例: Quark_Movies)" style="flex: 1;">
                <button class="btn-sm" style="background: var(--primary);" onclick="addChannel()">添加</button>
            </div>

            <div style="display:flex; justify-content: space-between; align-items: center; margin-top: 12px;">
                <button class="btn-sm" style="background:#475569;" onclick="closeConfigModal()">取消</button>
                <button class="btn" onclick="saveConfig()">💾 保存配置</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
