<!-- 在顶栏右侧新增“追剧订阅”入口按钮 -->
<button class="btn-tool" style="background:#8b5cf6; color:white;" onclick="openSubModal()">📺 追剧订阅</button>

<!-- 1. 选集转存勾选 Modal -->
<div class="modal" id="select-files-modal">
    <div class="modal-content" style="width: 680px;">
        <h3>🎬 解析选集转存 (自动洗剧清洗)</h3>
        <p style="font-size:12px; color:#94a3b8;">勾选需要保存的集数（已自动过滤无用广告与预告文件）：</p>
        
        <div style="display:flex; justify-content:space-between; margin: 8px 0;">
            <div>
                <button class="btn-sm" onclick="selectAllParseFiles(true)">全选正片</button>
                <button class="btn-sm" onclick="selectAllParseFiles(false)">取消全选</button>
            </div>
            <span id="selected-parse-count" style="font-size:12px; color:#38bdf8;">已选 0 文件</span>
        </div>

        <div id="parse-file-list" style="max-height:300px; overflow-y:auto; background:#0f172a; border:1px solid #334155; border-radius:6px; padding:8px;"></div>

        <div style="display:flex; justify-content: space-between; align-items:center; margin-top:12px;">
            <button class="btn-sm" style="background:#475569;" onclick="closeSelectFilesModal()">取消</button>
            <button class="btn" onclick="submitSaveSelectedFiles()">🚀 立即转存勾选项</button>
        </div>
    </div>
</div>

<!-- 2. 追剧订阅管理 Modal -->
<div class="modal" id="sub-modal">
    <div class="modal-content" style="width: 600px;">
        <h3>📺 追剧与动漫自动订阅管理</h3>
        
        <div class="section-title">➕ 添加新追剧订阅</div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
            <input type="text" id="sub-title-input" placeholder="剧集/动漫名称 (例: 兰香如故)">
            <input type="text" id="sub-pwd-input" placeholder="夸克链接 ID (例: ef7951063756)">
            <input type="text" id="sub-fid-input" placeholder="保存目标目录 FID (默认 0)">
            <select id="sub-interval-input" style="background:#0f172a; color:#fff; border:1px solid #334155; border-radius:4px; padding:6px;">
                <option value="2">每 2 小时检测一次</option>
                <option value="6" selected>每 6 小时检测一次</option>
                <option value="12">每 12 小时检测一次</option>
                <option value="24">每天检测一次</option>
            </select>
        </div>
        <button class="btn" style="margin-top:6px;" onclick="addSubscription()">➕ 添加自动追踪订阅</button>

        <div class="section-title" style="margin-top:14px;">📋 已订阅任务列表</div>
        <div id="sub-list-box" style="max-height:220px; overflow-y:auto; background:#0f172a; border:1px solid #334155; border-radius:6px; padding:8px;"></div>

        <div style="display:flex; justify-content: flex-end; margin-top:12px;">
            <button class="btn-sm" style="background:#475569;" onclick="closeSubModal()">关闭</button>
        </div>
    </div>
</div>
