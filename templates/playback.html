<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>MovieSync - 在线播放</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<header class="sticky top-0 z-30 border-b border-slate-800 bg-slate-950/90 px-4 py-3 backdrop-blur">
    <div class="mx-auto flex max-w-screen-xl items-center justify-between gap-3">
        <a href="/" class="text-sm text-slate-300 hover:text-white"><i class="fa-solid fa-arrow-left mr-2"></i>返回 MovieSync</a>
        <h1 class="text-lg font-semibold"><i class="fa-solid fa-play mr-2 text-sky-400"></i>在线播放</h1>
        <a href="/admin" class="text-sm text-slate-300 hover:text-white"><i class="fa-solid fa-gear mr-1"></i>卡片设置</a>
    </div>
</header>
<main class="mx-auto grid max-w-screen-xl gap-5 p-4 lg:grid-cols-[minmax(0,1.2fr)_minmax(320px,0.8fr)]">
    <section class="space-y-4">
        <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
            <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
                <div>
                    <h2 class="font-semibold">我的夸克网盘</h2>
                    <p class="mt-1 text-xs text-slate-400">只显示本人网盘中的视频；分享链接不在首期范围内。</p>
                </div>
                <button id="refresh-files" class="rounded-lg bg-sky-600 px-3 py-2 text-sm hover:bg-sky-500"><i class="fa-solid fa-rotate mr-1"></i>刷新</button>
            </div>
            <nav id="breadcrumbs" class="mb-3 flex flex-wrap items-center gap-2 text-xs text-slate-400" aria-label="目录路径"></nav>
            <p id="file-status" class="mb-3 text-sm text-slate-400">正在读取网盘目录…</p>
            <div id="file-list" class="space-y-1"></div>
        </div>
    </section>
    <section class="space-y-4">
        <div class="overflow-hidden rounded-2xl border border-slate-800 bg-black shadow-xl">
            <video id="video-player" class="aspect-video w-full bg-black" controls playsinline preload="metadata"></video>
        </div>
        <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
            <h2 id="now-playing" class="break-words font-semibold">请选择一个视频</h2>
            <p id="play-status" class="mt-2 text-sm text-slate-400">选择左侧视频后，将获取夸克短时播放地址。</p>
            <p class="mt-2 text-xs leading-5 text-slate-500">播放地址可能过期；重新点击视频即可重新获取。浏览器支持的编码取决于设备和视频本身。</p>
        </div>
    </section>
</main>
<script src="{{ url_for('static', filename='js/playback.js') }}" defer></script>
</body>
</html>
