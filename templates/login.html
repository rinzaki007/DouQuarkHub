<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ '首次初始化设置' if is_setup else '登录' }} - MovieSync 云影同步</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0b0f19;
        }
        .login-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 32px;
            width: 380px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .title-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .title-header h2 {
            color: #38bdf8;
            font-size: 20px;
            margin-bottom: 6px;
        }
        .title-header p {
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="title-header">
            <h2>🎬 MovieSync</h2>
            <p>{{ '首次部署请设置你的专属管理员账号' if is_setup else '请登录以继续使用服务' }}</p>
        </div>

        {% if is_setup %}
        <!-- 首次初始化表单 -->
        <form onsubmit="handleSetup(event)">
            <div class="form-group" style="margin-bottom: 14px;">
                <label>自定义管理员账号</label>
                <input type="text" id="setup-username" placeholder="请输入你的用户名" required>
            </div>
            <div class="form-group" style="margin-bottom: 18px;">
                <label>设置密码</label>
                <input type="password" id="setup-password" placeholder="请输入安全密码" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; height: 38px;">创建账号并登录</button>
        </form>
        {% else %}
        <!-- 正常登录表单 -->
        <form onsubmit="handleLogin(event)">
            <div class="form-group" style="margin-bottom: 14px;">
                <label>账号</label>
                <input type="text" id="login-username" required>
            </div>
            <div class="form-group" style="margin-bottom: 18px;">
                <label>密码</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; height: 38px;">登 录</button>
        </form>
        {% endif %}
    </div>
</div>

<script>
async function handleSetup(e) {
    e.preventDefault();
    const username = document.getElementById('setup-username').value;
    const password = document.getElementById('setup-password').value;
    const res = await fetch('/api/setup', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if(data.success) {
        window.location.href = '/';
    } else {
        alert(data.message);
    }
}

async function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;
    const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if(data.success) {
        window.location.href = '/';
    } else {
        alert(data.message);
    }
}
</script>
</body>
</html>
