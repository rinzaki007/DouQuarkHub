<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>后台管理 - MovieSync</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">🎬 MovieSync 管理后台</div>
        <a href="/"><button class="btn-secondary">返回前台首页</button></a>
    </header>

    <div class="admin-container">
        <!-- 左侧菜单 -->
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li class="active"><a href="#overview">📊 系统概览与日志</a></li>
                <li><a href="#subscribe">📺 自动追剧订阅</a></li>
                <li><a href="#settings">🛠️ 夸克与服务设置</a></li>
            </ul>
        </aside>

        <!-- 右侧主内容区 -->
        <main class="admin-content">
            <!-- 模块 1: 状态与日志 -->
            <section id="overview" style="margin-bottom: 30px;">
                <h3 style="margin-bottom: 16px;">系统状态监控</h3>
                <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                    <div style="background: var(--bg-card); padding: 16px; border-radius: 8px; border: 1px solid var(--border-color); flex: 1;">
                        <span style="color: var(--text-muted);">夸克 Cookie 状态:</span>
                        <span style="color: var(--success-color); font-weight: bold; margin-left: 8px;">● 有效</span>
                    </div>
                    <div style="background: var(--bg-card); padding: 16px; border-radius: 8px; border: 1px solid var(--border-color); flex: 1;">
                        <span style="color: var(--text-muted);">TG 机器人推送:</span>
                        <span style="color: var(--success-color); font-weight: bold; margin-left: 8px;">● 连通正常</span>
                    </div>
                </div>

                <h3>实时运行日志</h3>
                <div class="log-console" id="log-box">[System] 服务已启动...
[Quark] Cookie 状态刷新成功。
[Task] 追剧检测任务触发，暂无新剧集更新。</div>
            </section>

            <!-- 模块 2: 自动追剧任务管理 (原本弹窗内容放置于此) -->
            <section id="subscribe">
                <h3 style="margin-bottom: 16px;">添加自动追剧订阅</h3>
                <div style="background: var(--bg-card); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color);">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                        <div>
                            <label style="font-size: 13px; color: var(--text-muted);">剧集 / 动漫名称</label>
                            <div style="display: flex; gap: 8px; margin-top: 4px;">
                                <input type="text" placeholder="例如：甄嬛传" style="flex: 1;">
                                <!-- 修复了检索链接按钮背景 -->
                                <button class="btn-secondary">🔍 检索链接</button>
                            </div>
                        </div>
                        <div>
                            <label style="font-size: 13px; color: var(--text-muted);">夸克链接 ID / 分享短码</label>
                            <input type="text" placeholder="例如：ef7951063756" style="width: 100%; margin-top: 4px;">
                        </div>
                    </div>
                    
                    <!-- 修复了添加订阅按钮背景 -->
                    <button style="width: 100%;">+ 添加自动追踪订阅</button>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
