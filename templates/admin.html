    <script>

        let tgChannels = [];
        let logPollTimer = null;


        /* ==========================================================
           HTML 转义
           ========================================================== */

        function escapeHtml(value) {

            return String(value ?? '').replace(
                /[&<>\"']/g,
                char => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '\"': '&quot;',
                    "'": '&#39;'
                }[char])
            );

        }


        /* ==========================================================
           API 请求封装
           ========================================================== */

        async function apiFetch(url, options = {}) {

            const init = {
                ...options,
                credentials: 'same-origin'
            };


            const method =
                (init.method || 'GET').toUpperCase();


            const headers =
                new Headers(init.headers || {});


            if (
                !['GET', 'HEAD', 'OPTIONS'].includes(method)
            ) {

                const token =
                    document.querySelector(
                        'meta[name=csrf-token]'
                    )?.content;


                if (token) {

                    headers.set(
                        'X-CSRF-Token',
                        token
                    );

                }

            }


            init.headers = headers;


            const response =
                await window.fetch(
                    url,
                    init
                );


            if (response.status === 401) {

                window.location.href =
                    '/login';

            }


            return response;

        }


        /* ==========================================================

        async function loadConfigFromBackend() {

            try {

                const resp =
                    await apiFetch(
                        '/api/config'
                    );


                const res =
                    await resp.json();


                if (
                    res.success &&
                    res.config
                ) {

                    const cfg =
                        res.config;

                    renderResourceSourceHealth(
                        cfg.resource_sources || []
                    );


                    const cookieInput =
                        document.getElementById(
                            'quark-cookie'
                        );


                    cookieInput.value =
                        '';


                    cookieInput.placeholder =
                        cfg.has_quark_cookie
                            ? 'Cookie 已安全保存；需要更换时再粘贴新的 Cookie'
                            : '请粘贴夸克网盘 Cookie...';


                    document.getElementById(
                        'fid-default'
                    ).value =
                        cfg.default_fid ||
                        '0';


                    document.getElementById(
                        'openlist-url'
                    ).value =
                        cfg.openlist_url ||
                        'https://openlist.88888807.xyz:8807/';


                    const catFids =
                        cfg.category_fids ||
                        {};


                    document.getElementById(
                        'fid-movie'
                    ).value =
                        catFids['电影'] ||
                        '3ef79d1b370a4b27bd334b7bbba7e6e1';


                    document.getElementById(
                        'fid-tv'
                    ).value =
                        catFids['电视剧'] ||
                        'fe24e17d8d254997b21710c73b22b6e7';


                    document.getElementById(
                        'fid-show'
                    ).value =
                        catFids['综艺'] ||
                        '6999ba53a9384525881f785976bd09f1';


                    document.getElementById(
                        'fid-anime'
                    ).value =
                        catFids['动漫'] ||
                        '55a44b99fac641679e1ebf55dcb38be9';


                    tgChannels =
                        Array.isArray(cfg.channels)
                            ? cfg.channels
                            : [];


                    renderTGChannels();

                }

            } catch (err) {

                console.error(
                    '加载全局配置失败:',
                    err
                );

            }

        }


        /* ==========================================================
           标签页切换
           ========================================================== */

        function switchTab(tabName) {

            document.querySelectorAll(
                '.tab-btn'
            ).forEach(btn => {

                btn.className =
                    'tab-btn w-full text-left glass-panel hover:bg-slate-800/80 text-slate-300 px-3.5 py-2.5 rounded text-xs font-semibold flex items-center gap-2 transition';

            });


            document.querySelectorAll(
                '.panel-content'
            ).forEach(panel => {

                panel.classList.add(
                    'hidden'
                );

            });


            const activeBtn =
                document.getElementById(
                    `tab-btn-${tabName}`
                );


            if (activeBtn) {

                activeBtn.className =
                    'tab-btn w-full text-left bg-blue-600 text-white px-3.5 py-2.5 rounded text-xs font-semibold flex items-center gap-2 transition';

            }


            const activePanel =
                document.getElementById(
                    `panel-${tabName}`
                );


            if (activePanel) {

                activePanel.classList.remove(
                    'hidden'
                );

            }


            if (logPollTimer) {

                clearInterval(
                    logPollTimer
                );

                logPollTimer = null;

            }


            if (tabName === 'logs') {

                fetchAdminLogs();


                logPollTimer =
                    setInterval(
                        fetchAdminLogs,
                        3000
                    );

            }

        }


        /* ==========================================================
           TG 频道
           ========================================================== */

        function renderTGChannels() {

            const container =
                document.getElementById(
                    'tg-channels-container'
                );


            container.innerHTML =
                '';


            tgChannels.forEach(
                (ch, idx) => {

                    const badge =
                        document.createElement(
                            'div'
                        );


                    badge.className =
                        'bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 flex items-center gap-2 text-xs text-slate-200 shrink-0';


                    badge.innerHTML = `
                        <span>
                            <strong>${escapeHtml(ch.name || ch.id)}</strong>
                            (${escapeHtml(ch.id)})
                        </span>

                        <button
                            type="button"
                            onclick="removeTGChannel(${idx})"
                            class="text-slate-400 hover:text-rose-400 font-bold ml-1"
                        >
                            ✕
                        </button>
                    `;


                    container.appendChild(
                        badge
                    );

                }
            );

        }


        function addTGChannel() {

            const name =
                document.getElementById(
                    'new-ch-name'
                ).value.trim();


            const id =
                document.getElementById(
                    'new-ch-id'
                ).value
                    .trim()
                    .replace('@', '');


            if (!name || !id) {

                alert(
                    '请填写完整的频道名称和 ID'
                );

                return;

            }


            tgChannels.push({
                name,
                id
            });


            document.getElementById(
                'new-ch-name'
            ).value =
                '';


            document.getElementById(
                'new-ch-id'
            ).value =
                '';


            renderTGChannels();

        }


        function removeTGChannel(idx) {

            tgChannels.splice(
                idx,
                1
            );


            renderTGChannels();

        }

        /* ==========================================================
           导入配置
           ========================================================== */

        function importConfig() {

            const input =
                document.createElement(
                    'input'
                );


            input.type =
                'file';


            input.accept =
                'application/json';


            input.onchange =
                event => {

                    const file =
                        event.target.files[0];


                    if (!file) {

                        return;

                    }


                    const reader =
                        new FileReader();


                    reader.readAsText(
                        file,
                        'UTF-8'
                    );


                    reader.onload =
                        readerEvent => {

                            try {

                                const cfg =
                                    JSON.parse(
                                        readerEvent
                                            .target
                                            .result
                                    );


                                if (!cfg) {

                                    return;

                                }


                                if (
                                    cfg.quark_cookie
                                ) {

                                    document.getElementById(
                                        'quark-cookie'
                                    ).value =
                                        cfg.quark_cookie;

                                }


                                if (
                                    cfg.default_fid
                                ) {

                                    document.getElementById(
                                        'fid-default'
                                    ).value =
                                        cfg.default_fid;

                                }


                                if (
                                    cfg.openlist_url
                                ) {

                                    document.getElementById(
                                        'openlist-url'
                                    ).value =
                                        cfg.openlist_url;

                                }


                                if (
                                    cfg.category_fids
                                ) {

                                    document.getElementById(
                                        'fid-movie'
                                    ).value =
                                        cfg.category_fids['电影'] ||
                                        '';


                                    document.getElementById(
                                        'fid-tv'
                                    ).value =
                                        cfg.category_fids['电视剧'] ||
                                        '';


                                    document.getElementById(
                                        'fid-show'
                                    ).value =
                                        cfg.category_fids['综艺'] ||
                                        '';


                                    document.getElementById(
                                        'fid-anime'
                                    ).value =
                                        cfg.category_fids['动漫'] ||
                                        '';

                                }


                                if (
                                    Array.isArray(
                                        cfg.channels
                                    )
                                ) {

                                    tgChannels =
                                        cfg.channels;


                                    renderTGChannels();

                                }


                                alert(
                                    '配置成功导入！请点击右下角【保存全部设置】。'
                                );

                            } catch (err) {

                                console.error(
                                    '导入配置失败:',
                                    err
                                );


                                alert(
                                    '读取配置文件失败: JSON 格式非法'
                                );

                            }

                        };

                };


            input.click();

        }


        async function checkResourceSources() {
            const box = document.getElementById("resource-source-health");
            if (box) {
                box.innerHTML = '<div class="glass-panel rounded-xl p-3 text-xs text-slate-400">正在检查资源来源…</div>';
            }
            try {
                const response = await apiFetch("/api/check-channels");
                const result = await response.json();
                if (!result.success) {
                    throw new Error(result.message || "检查失败");
                }
                renderResourceSourceHealth(result.resource_sources || []);
            } catch (error) {
                if (box) {
                    box.innerHTML = '<div class="glass-panel rounded-xl p-3 text-xs text-rose-300">检查失败：' + escapeHtml(String(error.message || error)) + '</div>';
                }
            }
        }

        function renderResourceSourceHealth(sources) {
            const box = document.getElementById("resource-source-health");
            if (!box) return;
            if (!sources.length) {
                box.innerHTML = '<div class="glass-panel rounded-xl p-4 text-xs text-slate-500">暂无资源来源</div>';
                return;
            }

            const statusMeta = {
                healthy: ["正常", "text-emerald-300", "fa-circle-check"],
                degraded: ["部分可用", "text-amber-300", "fa-triangle-exclamation"],
                unavailable: ["不可用", "text-rose-300", "fa-circle-xmark"],
                disabled: ["已停用", "text-slate-500", "fa-circle-minus"],
                unknown: ["未检查", "text-slate-400", "fa-circle-question"]
            };

            box.innerHTML = sources.map((source) => {
                const health = source.health || {};
                const status = health.status || source.status || "unknown";
                const meta = statusMeta[status] || statusMeta.unknown;
                const message = health.message || source.message || "尚未检查";
                const checked = health.last_checked_at
                    ? new Date(health.last_checked_at * 1000).toLocaleString()
                    : "—";
                const channels = health.channels || source.channels || [];
                const failed = channels.filter((item) => item.status !== "healthy");
                const healthyCount = channels.filter((item) => item.status === "healthy").length;

                const channelSummary = channels.length
                    ? healthyCount + "/" + channels.length + " 个频道正常"
                    : "未返回频道明细";

                return '<div class="glass-panel rounded-2xl p-4">' +
                    '<div class="flex flex-wrap items-center justify-between gap-3">' +
                        '<div class="min-w-0">' +
                            '<div class="flex items-center gap-2 text-sm font-semibold text-slate-100">' +
                                '<span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-xl bg-slate-950/60 text-slate-400 border border-slate-700/50">' +
                                    '<i class="fa-solid fa-plug"></i>' +
                                '</span>' +
                                '<span>' + escapeHtml(source.name || source.id || "未知来源") + '</span>' +
                            '</div>' +
                            '<div class="mt-1 text-[10px] text-slate-500">' +
                                escapeHtml(channelSummary) + ' · 最近检查 ' + escapeHtml(checked) +
                            '</div>' +
                        '</div>' +
                        '<span class="shrink-0 rounded-full border border-current/10 px-2.5 py-1 text-[11px] font-medium ' + meta[1] + '">' +
                            '<i class="fa-solid ' + meta[2] + ' mr-1"></i>' + meta[0] +
                        '</span>' +
                    '</div>' +
                    '<div class="mt-3 rounded-xl border border-slate-700/40 bg-slate-950/25 px-3 py-2 text-[11px] text-slate-400">' +
                        escapeHtml(message) +
                    '</div>' +
                    (channels.length ? (
                        '<div class="mt-3 grid grid-cols-1 gap-2 sm:grid-cols-2">' +
                            channels.map((channel) => {
                                const ok = channel.status === "healthy";
                                const partial = channel.status === "degraded";
                                const color = ok ? "text-emerald-300" : partial ? "text-amber-300" : "text-rose-300";
                                const icon = ok ? "fa-circle-check" : partial ? "fa-triangle-exclamation" : "fa-circle-xmark";
                                const label = ok ? "正常" : partial ? "异常" : "不可用";
                                const border = ok
                                    ? "border-emerald-400/15 bg-emerald-400/[0.04]"
                                    : partial
                                        ? "border-amber-400/20 bg-amber-400/[0.05]"
                                        : "border-rose-400/20 bg-rose-400/[0.05]";
                                return '<div class="min-w-0 rounded-xl border ' + border + ' px-3 py-2.5">' +
                                    '<div class="flex items-center justify-between gap-2">' +
                                        '<div class="min-w-0 flex items-center gap-1.5 text-xs font-medium text-slate-200">' +
                                            '<i class="fa-solid ' + icon + ' ' + color + '"></i>' +
                                            '<span class="truncate" title="' + escapeHtml(channel.id || "") + '">' +
                                                escapeHtml(channel.name || channel.id || "未命名频道") +
                                            '</span>' +
                                        '</div>' +
                                        '<span class="shrink-0 text-[10px] font-medium ' + color + '">' + label + '</span>' +
                                    '</div>' +
                                    '<div class="mt-1 truncate text-[10px] text-slate-500" title="' + escapeHtml(channel.message || "") + '">' +
                                        escapeHtml(channel.message || "未返回检测信息") +
                                    '</div>' +
                                '</div>';
                            }).join("") +
                        '</div>'
                    ) : '') +
                    (failed.length
                        ? '<div class="mt-3 flex items-center gap-1.5 rounded-lg bg-rose-500/5 px-2.5 py-2 text-[10px] font-medium text-rose-300"><i class="fa-solid fa-triangle-exclamation"></i>有 ' + failed.length + ' 个频道异常，建议检查频道配置。</div>'
                        : '') +
                '</div>';
            }).join("");
        }

        /* ==========================================================
           账户安全 - 修改用户名
           ========================================================== */

        async function changeAdminUsername() {

            const currentPassword =
                document.getElementById(
                    'security-username-current-password'
                ).value;


            const newUsername =
                document.getElementById(
                    'new-username'
                ).value.trim();


            if (!currentPassword) {

                alert(
                    '请输入当前密码。'
                );

                return;

            }


            if (!newUsername) {

                alert(
                    '请输入新的管理员用户名。'
                );

                return;

            }


            if (
                newUsername.length < 2 ||
                newUsername.length > 64
            ) {

                alert(
                    '用户名长度必须为 2～64 个字符。'
                );

                return;

            }


            try {

                const response =
                    await apiFetch(
                        '/api/change-username',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify({
                                    current_password:
                                        currentPassword,

                                    new_username:
                                        newUsername
                                })
                        }
                    );


                const result =
                    await response.json();


                if (!result.success) {

                    alert(
                        result.message ||
                        '修改用户名失败'
                    );

                    return;

                }


                alert(
                    result.message ||
                    '用户名修改成功，请重新登录。'
                );


                window.location.href =
                    '/login';

            } catch (error) {

                console.error(
                    '修改用户名失败:',
                    error
                );


                alert(
                    '修改用户名失败：' +
                    error.message
                );

            }

        }

        async function changeAdminPassword() {

            const currentPassword =
                document.getElementById(
                    'security-current-password'
                ).value;


            const newPassword =
                document.getElementById(
                    'security-new-password'
                ).value;


            const confirmPassword =

                ).value;


            if (!currentPassword) {

                return;

            }


            if (!newPassword) {

                alert(
                    '请输入新密码。'
                );

                return;

            if (

                newPassword.length > 128
            ) {

                alert(
                    '新密码长度必须为 8～128 个字符。'

            }


            if (
                newPassword !==
                confirmPassword
            ) {

                alert(

                return;

            }


            try {

                const response =
                    await apiFetch(

                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                                    current_password:
                                        currentPassword,

                                    new_password:

                                })

                    );


                const result =
                    await response.json();


                if (!result.success) {

                    alert(

                alert(

                );
