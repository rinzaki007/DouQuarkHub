<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - MovieSync</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .admin-layout { display: flex; height: calc(100vh - 56px); }
        .sidebar { width: 220px; background: #111827; border-right: 1px solid #1f2937; padding: 12px; }
        .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 4px; }
        .sidebar-menu li { padding: 10px 12px; border-radius: 6px; cursor: pointer; color: #94a3b8; font-size: 13px; font-weight: 600; }
        .sidebar-menu li:hover, .sidebar-menu li.active { background: #1f2937; color: #38bdf8; }
        .admin-main { flex: 1; padding: 20px; overflow-y: auto; background: #0b0f19; }
        .admin-section { display: none; }
        .admin-section.active { display: flex; flex-direction: column; gap: 16px; }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="logo-area">
            <span class="logo-icon">⚙️</span>
            <h1>MovieSync 后台控制中心</h1>
        </div>
        <div>
            <a href="/"><button class="action-btn btn-secondary">返回前台</button></a>
            <a href="/logout"><button class="action-btn btn-secondary">退出登录</button></a>
        </div>
    </header>

    <div class="admin-layout">
        <!-- 侧边栏菜单 -->
        <div class="sidebar">
            <ul class="sidebar-menu">
                <li class="active" onclick="switchSection('status')">⚡ 系统监控与日志</li>
                <li onclick="switchSection('sub')">📊 自动化追剧任务</li>
                <li onclick="switchSection('config')">⚙️ 夸克与系统设置</li>
            </ul>
        </div>

        <!-- 主内容区 -->
        <div class="admin-main">
            <!-- 模块 1: 系统监控与日志 -->
            <div id="sec-status" class="admin-section active">
                <div class="panel">
                    <div class="panel-header">
                        <h3>⚡ 运行状态服务监控</h3>
                        <button class="btn-sm" onclick="refreshAdminStatus()">🔄 刷新检测</button>
                    </div>
                    <div class="status-items">
                        <div class="status-row"><span>夸克 Cookie:</span><span id="quark-status-badge" class="badge badge-warning">检测中...</span></div>
                        <div class="status-row"><span>TG 检索频道:</span><span id="channel-status-badge" class="badge badge-warning">检测中...</span></div>
                    </div>
                </div>

                <div class="panel" style="flex:1;">
                    <div class="panel-header">
                        <h3>🟢 实时日志控制台</h3>
                        <button class="btn-sm" onclick="clearAdminLog()">清空日志</button>
                    </div>
                    <div id="log-body" class="log-body" style="height: 380px;">MovieSync 服务就绪...</div>
                </div>
            </div>

            <!-- 模块 2: 追剧订阅列表 -->
            <div id="sec-sub" class="admin-section">
                <h2>📊 自动化追踪任务管理</h2>
                <div id="sub-list-box" class="sub-list-scroll" style="max-height:500px;"></div>
            </div>

            <!-- 模块 3: 全局系统设置 (夸克 Cookie / 目录 FID / TG 频道) -->
            <div id="sec-config" class="admin-section">
                <div class="modal-content" style="box-shadow:none; border:1px solid #1f2937;">
                    <h2>⚙️ 全局设置项</h2>
                    <div class="form-group">
                        <label>夸克网盘 Cookie (ck):</label>
                        <textarea id="quark-cookie-input" style="height:70px;"></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group"><label>默认全局 FID:</label><input type="text" id="folder-id-input"></div>
                        <div class="form-group"><label>OpenList 地址:</label><input type="text" id="openlist-url-input"></div>
                    </div>

                    <h3 style="margin-top:5px; font-size:13px; color:#38bdf8;">📁 各分类目录 FID</h3>
                    <div class="form-row">
                        <div class="form-group"><label>电影目录 FID:</label><input type="text" id="folder-movie-input"></div>
                        <div class="form-group"><label>电视剧目录 FID:</label><input type="text" id="folder-tv-input"></div>
                    </div>

                    <div class="form-group">
                        <label>TG 检索频道管理:</label>
                        <div class="channel-manage-box">
                            <div id="channel-list-box" class="channel-list-scroll"></div>
                            <div class="channel-add-row">
                                <input type="text" id="new-ch-name" placeholder="频道名称">
                                <input type="text" id="new-ch-id" placeholder="频道 ID">
                                <button type="button" class="btn-primary" onclick="addChannel()">添加</button>
                            </div>
                        </div>
                    </div>

                    <div style="display:flex; justify-content:flex-end;">
                        <button class="btn-primary" onclick="saveAdminConfig()">保存全部设置</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/admin.js"></script>
</body>
</html>
