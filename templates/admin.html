<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieSync - 后台控制中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100">

    <!-- 顶栏 -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-3.5 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2 text-lg font-bold text-white">
            <i class="fa-solid fa-gear text-blue-500"></i> MovieSync 后台控制中心
        </div>
        <div class="flex gap-2">
            <a href="/" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3.5 py-2 rounded transition">
                返回前台首页
            </a>
            <a href="/logout" class="bg-rose-900/60 hover:bg-rose-800 text-rose-200 text-xs px-3.5 py-2 rounded transition">
                退出登录
            </a>
        </div>
    </header>

    <!-- 双栏主体 -->
    <div class="flex-1 flex overflow-hidden">
        <!-- 侧边栏 -->
        <aside class="w-60 bg-slate-900/80 border-r border-slate-800 p-4 shrink-0 flex flex-col gap-2">
            <button class="w-full text-left bg-blue-600 text-white px-3.5 py-2.5 rounded text-xs font-semibold flex items-center gap-2">
                <i class="fa-solid fa-sliders"></i> 全局设置与配置迁移
            </button>
        </aside>

        <!-- 内容主区 -->
        <main class="flex-1 overflow-y-auto p-6 bg-slate-950 text-sm">
            <div class="max-w-4xl space-y-6">
                <h2 class="text-base font-bold text-white flex items-center gap-2 border-b border-slate-800 pb-3">
                    <i class="fa-solid fa-gears text-blue-400"></i> 全局系统参数设置
                </h2>

                <!-- Cookie -->
                <div class="space-y-1.5">
                    <label class="block text-xs text-slate-400 font-semibold">夸克网盘 Cookie (ck):</label>
                    <textarea id="quark-cookie" rows="4" 
                        class="w-full bg-slate-900 border border-slate-800 rounded p-3 text-xs font-mono text-slate-200 focus:outline-none focus:border-blue-500 break-all" 
                        placeholder="请粘贴夸克网盘 Cookie..."></textarea>
                </div>

                <!-- 存储目录 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="block text-xs text-slate-400 font-semibold">默认全局存储目录 FID:</label>
                        <input type="text" id="fid-default" value="0" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200">
                    </div>
                    <div class="space-y-1">
                        <label class="block text-xs text-slate-400 font-semibold">OpenList 访问地址:</label>
                        <input type="text" id="openlist-url" value="https://openlist.88888807.xyz:8807/" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200">
                    </div>
                </div>

                <!-- 各分类专属 FID -->
                <div class="space-y-2 pt-2">
                    <h3 class="text-xs font-bold text-amber-400 flex items-center gap-1">
                        <i class="fa-solid fa-folder"></i> 各分类专属存储目录 FID (未设定则自动使用默认全局 FID)
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">🎬 电影目录 FID:</label>
                            <input type="text" id="fid-movie" value="3ef79d1b370a4b27bd334b7bbba7e6e1" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-200">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">📺 电视剧目录 FID:</label>
                            <input type="text" id="fid-tv" value="fe24e17d8d254997b21710c73b22b6e7" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-200">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">🎤 综艺目录 FID:</label>
                            <input type="text" id="fid-show" value="6999ba53a9384525881f785976bd09f1" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-200">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">🎨 动漫目录 FID:</label>
                            <input type="text" id="fid-anime" value="55a44b99fac641679e1ebf55dcb38be9" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs text-slate-200">
                        </div>
                    </div>
                </div>

                <!-- TG 检索频道配置管理（彻底修复元素重叠遮挡问题） -->
                <div class="space-y-3 pt-4 border-t border-slate-800">
                    <h3 class="text-xs font-bold text-slate-300">TG 检索频道配置管理:</h3>
                    
                    <!-- 频道标签列表：采用规范的 flex-wrap 自然流排版 -->
                    <div id="tg-channels-container" class="flex flex-wrap gap-2 p-3 bg-slate-900/60 rounded-lg border border-slate-800">
                        <!-- JS 动态渲染 -->
                    </div>

                    <!-- 添加频道表单：独立的 flex 行，绝不重叠 -->
                    <div class="flex flex-wrap items-center gap-2 pt-2 p-3 bg-slate-900/40 rounded-lg border border-slate-800/80">
                        <input type="text" id="new-ch-name" placeholder="频道名称 (例如: 夸克电影)" class="bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs flex-1 min-w-[150px] text-slate-200">
                        <input type="text" id="new-ch-id" placeholder="频道 ID (例如: quark_movies)" class="bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs flex-1 min-w-[150px] text-slate-200">
                        <button onclick="addTGChannel()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-1.5 rounded font-medium shrink-0">
                            添加频道
                        </button>
                    </div>
                </div>

                <!-- 底部保存按钮行 -->
                <div class="border-t border-slate-800 pt-6 flex flex-wrap justify-between items-center gap-3 mb-10">
                    <div class="flex gap-2">
                        <button onclick="exportConfig()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3.5 py-2 rounded flex items-center gap-1 border border-slate-700">
                            <i class="fa-solid fa-download"></i> 导出配置 JSON
                        </button>
                        <button onclick="importConfig()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3.5 py-2 rounded flex items-center gap-1 border border-slate-700">
                            <i class="fa-solid fa-upload"></i> 导入配置 JSON
                        </button>
                    </div>
                    <button onclick="saveAllSettings()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-6 py-2.5 rounded flex items-center gap-2 shadow-lg">
                        <i class="fa-solid fa-floppy-disk"></i> 保存全部设置
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let tgChannels = [
            { name: '夸克云盘综合资源', id: 'Quark_Movies' },
            { name: 'YOYO资源|夸克|短剧', id: 'yoyokuakeduanju' },
            { name: 'UC夸克百度迅雷资源分享', id: 'ucquark' },
            { name: '夸克网盘资源收藏夹', id: 'QuarkFree' },
            { name: 'leo资源(夸克)', id: 'leoziyuan' },
            { name: '夸克 (百草)', id: 'baicaozi' },
            { name: '夸克(网盘高分影视)', id: 'SharePanFilms' },
            { name: '夸克(书籍)', id: 'BooksRealm' },
            { name: 'Q_dongman', id: 'Q_dongman' },
            { name: '夸克网盘动漫资源', id: 'kuakedongman' },
            { name: 'kduanju', id: 'kduanju' },
            { name: 'Q_jilupian', id: 'Q_jilupian' },
            { name: 'yunpanquark', id: 'yunpanquark' },
            { name: 'Q_dianying', id: 'Q_dianying' },
            { name: 'gokuapan', id: 'gokuapan' },
            { name: 'kuyupan', id: 'kuyupan' },
            { name: 'kuakenetpan', id: 'kuakenetpan' }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            renderTGChannels();
        });

        function renderTGChannels() {
            const container = document.getElementById('tg-channels-container');
            container.innerHTML = '';
            tgChannels.forEach((ch, idx) => {
                const badge = document.createElement('div');
                badge.className = "bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 flex items-center gap-2 text-xs text-slate-200 shrink-0";
                badge.innerHTML = `
                    <span><strong>${ch.name}</strong> (${ch.id})</span>
                    <button onclick="removeTGChannel(${idx})" class="text-slate-400 hover:text-rose-400 font-bold ml-1">✕</button>
                `;
                container.appendChild(badge);
            });
        }

        function addTGChannel() {
            const name = document.getElementById('new-ch-name').value.trim();
            const id = document.getElementById('new-ch-id').value.trim().replace('@', '');
            if (!name || !id) return alert('请填写频道名称和 ID');
            tgChannels.push({ name, id });
            document.getElementById('new-ch-name').value = '';
            document.getElementById('new-ch-id').value = '';
            renderTGChannels();
        }

        function removeTGChannel(idx) {
            tgChannels.splice(idx, 1);
            renderTGChannels();
        }

        async function saveAllSettings() {
            const payload = {
                cookie: document.getElementById('quark-cookie').value.trim(),
                default_fid: document.getElementById('fid-default').value.trim(),
                openlist_url: document.getElementById('openlist-url').value.trim(),
                category_fids: {
                    '电影': document.getElementById('fid-movie').value.trim(),
                    '电视剧': document.getElementById('fid-tv').value.trim(),
                    '综艺': document.getElementById('fid-show').value.trim(),
                    '动漫': document.getElementById('fid-anime').value.trim()
                },
                channels: tgChannels
            };

            try {
                const resp = await fetch('/api/channels', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ channels: tgChannels })
                });
                alert('设置保存成功！');
            } catch (e) {
                alert('保存设置异常: ' + e.message);
            }
        }
    </script>
</body>
</html>
