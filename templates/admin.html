<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - MovieSync</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* 修复 TG 检索频道标签浮动与重叠错乱问题 */
.tg-channel-container, [class*="channel-list"] {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 8px !important;
    margin-bottom: 16px !important;
    clear: both !important;
}

/* 规范频道标签内边距与边框 */
.tg-channel-tag, [class*="channel-item"] {
    position: relative !important;
    display: inline-flex !important;
    align-items: center !important;
    background-color: #1e293b !important;
    border: 1px solid #334155 !important;
    border-radius: 6px !important;
    padding: 6px 12px !important;
    margin: 0 !important;
}

/* 规范按钮布局 */
.admin-action-btns {
    display: flex !important;
    align-items: center !important;
    gap: 12px !important;
    margin-top: 12px !important;
}
        .admin-layout { display: flex; height: calc(100vh - 56px); }
        .sidebar { width: 220px; background: #111827; border-right: 1px solid #1f2937; padding: 12px; flex-shrink: 0; }
        .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 4px; }
        .sidebar-menu li { padding: 10px 12px; border-radius: 6px; cursor: pointer; color: #94a3b8; font-size: 13px; font-weight: 600; }
        .sidebar-menu li:hover, .sidebar-menu li.active { background: #1f2937; color: #38bdf8; }
        .admin-main { flex: 1; padding: 24px; overflow-y: auto; background: #0b0f19; }
        .admin-section { display: none; width: 100%; }
        .admin-section.active { display: flex; flex-direction: column; gap: 16px; }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="logo-area">
            <span class="logo-icon">⚙️</span>
            <h1>MovieSync 后台控制中心</h1>
        </div>
        <div>
            <a href="/"><button class="action-btn btn-secondary">返回前台首页</button></a>
            <a href="/logout"><button class="action-btn btn-secondary">退出登录</button></a>
        </div>
    </header>

    <div class="admin-layout">
        <!-- 侧边栏菜单 -->
        <div class="sidebar">
            <ul class="sidebar-menu">
                <li class="active" onclick="switchSection('config')">⚙️ 全局设置与配置迁移</li>
                <li onclick="switchSection('sub')">📊 自动化追剧任务</li>
                <li onclick="switchSection('status')">📋 系统运行日志</li>
            </ul>
        </div>

        <!-- 主内容区 -->
        <div class="admin-main">
            <!-- 🎯 模块 1: 全局设置 (补全四大分类目录 FID) -->
            <div id="sec-config" class="admin-section active">
                <div class="admin-card-full">
                    <h2>⚙️ 全局系统参数设置</h2>
                    
                    <div class="form-group" style="margin-top: 10px;">
                        <label>夸克网盘 Cookie (ck):</label>
                        <textarea id="quark-cookie-input" style="height:85px; width:100%;"></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group"><label>默认全局存储目录 FID:</label><input type="text" id="folder-id-input" placeholder="默认为 0 (根目录)"></div>
                        <div class="form-group"><label>OpenList 访问地址:</label><input type="text" id="openlist-url-input"></div>
                    </div>

                    <h3 style="margin-top:12px; font-size:13px; color:#38bdf8;">📁 各分类专属存储目录 FID (未设定则自动使用默认全局 FID)</h3>
                    <div class="form-row">
                        <div class="form-group"><label>🎬 电影目录 FID:</label><input type="text" id="folder-movie-input" placeholder="留空使用默认 FID"></div>
                        <div class="form-group"><label>📺 电视剧目录 FID:</label><input type="text" id="folder-tv-input" placeholder="留空使用默认 FID"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>🎤 综艺目录 FID:</label><input type="text" id="folder-show-input" placeholder="留空使用默认 FID"></div>
                        <div class="form-group"><label>🎨 动漫目录 FID:</label><input type="text" id="folder-anime-input" placeholder="留空使用默认 FID"></div>
                    </div>

                    <div class="form-group" style="margin-top: 10px;">
                        <label>TG 检索频道配置管理:</label>
                        <div class="channel-manage-box">
                            <div id="channel-list-box" class="channel-list-scroll" style="max-height: 160px;"></div>
                            <div class="channel-add-row" style="margin-top: 8px;">
                                <input type="text" id="new-ch-name" placeholder="频道名称 (例如: 夸克电影分享)">
                                <input type="text" id="new-ch-id" placeholder="频道 ID (例如: quark_movies)">
                                <button type="button" class="btn-primary" onclick="addChannel()">添加频道</button>
                            </div>
                        </div>
                    </div>

                    <!-- 配置导入/导出 -->
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px; padding-top:16px; border-top:1px solid #1f2937;">
                        <div style="display:flex; gap:10px;">
                            <button class="btn-secondary" onclick="exportConfig()">📤 导出配置 JSON</button>
                            <button class="btn-secondary" onclick="triggerImportConfig()">📥 导入配置 JSON</button>
                            <input type="file" id="import-file-input" accept=".json" style="display:none;" onchange="handleImportConfig(event)">
                        </div>
                        <button class="btn-primary" style="height:38px; padding:0 24px;" onclick="saveAdminConfig()">💾 保存全部设置</button>
                    </div>
                </div>
            </div>

            <!-- 模块 2: 追剧订阅列表 -->
            <div id="sec-sub" class="admin-section">
                <h2>📊 自动化追踪任务管理</h2>
                <div id="sub-list-box" class="sub-list-scroll" style="max-height:550px;"></div>
            </div>

            <!-- 🎯 模块 3: 系统运行控制台日志 (移除多余状态监控，增加彩色日志分级过滤) -->
            <div id="sec-status" class="admin-section">
                <div class="panel" style="width: 100%;">
                    <div class="panel-header">
                        <h3>📋 详细控制台运行日志</h3>
                        <div style="display:flex; gap:6px;">
                            <button class="btn-sm" onclick="filterLogs('ALL')">全部</button>
                            <button class="btn-sm" style="color:#38bdf8;" onclick="filterLogs('INFO')">普通</button>
                            <button class="btn-sm" style="color:#34d399;" onclick="filterLogs('SUCCESS')">成功</button>
                            <button class="btn-sm" style="color:#fbbf24;" onclick="filterLogs('WARN')">警告</button>
                            <button class="btn-sm" style="color:#f87171;" onclick="filterLogs('ERROR')">错误</button>
                            <button class="btn-sm" onclick="clearAdminLog()">清空</button>
                        </div>
                    </div>
                    <div id="admin-log-body" class="log-body" style="height: 520px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/admin.js"></script>
</body>
</html>
