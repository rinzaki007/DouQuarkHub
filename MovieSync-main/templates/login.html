<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ '系统初始化' if is_setup else '系统登录' }} - MovieSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-600/20 text-blue-500 text-xl mb-1">
                <i class="fa-solid fa-film"></i>
            </div>
            <h1 class="text-xl font-bold text-white tracking-wide">MovieSync</h1>
            <p class="text-xs text-slate-400">{{ '请创建管理员账号以初始化系统' if is_setup else '请登录以继续使用服务' }}</p>
        </div>

        <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
            <div class="space-y-1">
                <label class="text-xs font-medium text-slate-300">账号</label>
                <input type="text" id="username" required placeholder="请输入管理员账号" 
                       class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-medium text-slate-300">密码</label>
                <input type="password" id="password" required placeholder="请输入密码" 
                       class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
            </div>
            <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-medium transition shadow-lg shadow-blue-600/20">
                {{ '立即初始化并登录' if is_setup else '登 录' }}
            </button>
        </form>
    </div>

    <script>
        const isSetup = {{ 'true' if is_setup else 'false' }};
        async function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const endpoint = isSetup ? '/api/setup' : '/api/login';

            try {
                const resp = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const res = await resp.json();
                if (res.success) {
                    window.location.href = '/';
                } else {
                    alert(res.message || '操作失败');
                }
            } catch (err) {
                alert('请求发生异常');
            }
        }
    </script>
</body>
</html>
